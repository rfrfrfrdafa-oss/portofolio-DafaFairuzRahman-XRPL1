<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" style="background-color: #050914;">
  <defs>
    <!-- Jalur orbit utama yang mendefinisikan bentuk elips -->
    <path id="orbitPath" d="M 150 500 A 350 150 0 1 1 850 500 A 350 150 0 1 1 150 500" fill="none" stroke-width="20" stroke-linecap="round" />
    
    <!-- Filter pendaran untuk cincin -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Filter pendaran berlapis untuk bola putih -->
    <filter id="ballGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradien radial untuk area iluminasi (Topeng) -->
    <radialGradient id="lightGradient">
      <stop offset="0%" stop-color="white" stop-opacity="1" />
      <stop offset="40%" stop-color="white" stop-opacity="0.7" />
      <stop offset="100%" stop-color="black" stop-opacity="0" />
    </radialGradient>

    <!-- Topeng (Mask) pengungkap cahaya yang bergerak -->
    <mask id="illuminationMask">
      <circle r="300" fill="url(#lightGradient)">
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear">
          <mpath href="#orbitPath" />
        </animateMotion>
      </circle>
    </mask>
  </defs>

  <!-- Grup utama yang dimiringkan secara serentak -->
  <g transform="rotate(-25 500 500)">
    
    <!-- 1. Cincin Dasar (Statis, gelap, tidak menyala) -->
    <use href="#orbitPath" stroke="#0f172a" />

    <!-- 2. Cincin Menyala (Disembunyikan oleh mask, hanya muncul saat bola mendekat) -->
    <use href="#orbitPath" stroke="#00e5ff" filter="url(#ringGlow)" mask="url(#illuminationMask)" />

    <!-- 3. Bola Cahaya Putih (Bergerak mengikuti jalur yang persis sama) -->
    <circle r="24" fill="#ffffff" filter="url(#ballGlow)">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear">
        <mpath href="#orbitPath" />
      </animateMotion>
    </circle>
    
  </g>
</svg>