        <tspan fill="#38bdf8">-(</tspan><tspan fill="#38bdf8" font-weight="bold">nitro㉿someone</tspan><tspan fill="#38bdf8">)-[</tspan><tspan fill="#ffffff">/mnt/c/Users/Dafa Fairuz Rahman/Music</tspan><tspan fill="#38bdf8">]</tspan>
