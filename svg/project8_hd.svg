      <text x="0" y="20"><tspan fill="#38bdf8" font-weight="bold">OS:</tspan> <tspan fill="#e4e4e7">Kali GNU/Linux Rolling x86_64</tspan></text>
      <text x="0" y="44"><tspan fill="#38bdf8" font-weight="bold">Host:</tspan> <tspan fill="#e4e4e7">Windows Subsystem for Linux - kali-linux (3.0.3.0)</tspan></text>
      <text x="0" y="68"><tspan fill="#38bdf8" font-weight="bold">Kernel:</tspan> <tspan fill="#e4e4e7">Linux 6.18.54.1-microsoft-standard-WSL2</tspan></text>
