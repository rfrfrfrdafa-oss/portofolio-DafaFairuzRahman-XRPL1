        <path d="M 215 145 A 18 18 0 1 1 190 155 A 80 80 0 0 0 120 40 L 120 15 A 100 100 0 0 1 215 145 Z"/>
        <path d="M 85 240 A 80 80 0 0 0 155 240 A 18 18 0 1 1 170 260 A 100 100 0 0 1 70 260 Z"/>
        <circle cx="20" cy="145" r="14" fill="#ffffff"/>
        <circle cx="215" cy="145" r="14" fill="#ffffff"/>
        <circle cx="120" cy="265" r="14" fill="#ffffff"/>
      </g>
    </g>

    <!-- Ubuntu Fastfetch System Specs (from photo) -->
    <g transform="translate(290, 75)" font-family="'Consolas', 'Courier New', monospace" font-size="14.5">
      <!-- User Host -->
      <text x="0" y="20"><tspan fill="#ef4444" font-weight="bold">dafa_fairuz_rahman</tspan><tspan fill="#ffffff">@</tspan><tspan fill="#ef4444" font-weight="bold">someone</tspan></text>
      <line x1="0" y1="28" x2="380" y2="28" stroke="#ef4444" stroke-width="1.5"/>

      <!-- Specs List from Photo -->
      <text x="0" y="55"><tspan fill="#ef4444" font-weight="bold">OS:</tspan> <tspan fill="#e4e4e7">Ubuntu 24.04.1 LTS (Resolute) x86_64</tspan></text>
      <text x="0" y="80"><tspan fill="#ef4444" font-weight="bold">Host:</tspan> <tspan fill="#e4e4e7">Windows Subsystem for Linux - Ubuntu (3.0.3.0)</tspan></text>
      <text x="0" y="105"><tspan fill="#ef4444" font-weight="bold">Kernel:</tspan> <tspan fill="#e4e4e7">Linux 6.18.54.1-microsoft-standard-WSL2</tspan></text>
      <text x="0" y="130"><tspan fill="#ef4444" font-weight="bold">Uptime:</tspan> <tspan fill="#e4e4e7">1 hour, 16 mins</tspan></text>
      <text x="0" y="155"><tspan fill="#ef4444" font-weight="bold">Packages:</tspan> <tspan fill="#e4e4e7">612 (dpkg)</tspan></text>
      <text x="0" y="180"><tspan fill="#ef4444" font-weight="bold">Shell:</tspan> <tspan fill="#e4e4e7">bash 5.3.9</tspan></text>
      <text x="0" y="205"><tspan fill="#ef4444" font-weight="bold">Display (rdp-0):</tspan> <tspan fill="#e4e4e7">1920x1200, 60 Hz</tspan></text>
      <text x="0" y="230"><tspan fill="#ef4444" font-weight="bold">WM:</tspan> <tspan fill="#e4e4e7">WSLg WSLg: 1.0.79</tspan></text>
    </g>
  </g>

  <!-- ==================== TOP RIGHT WINDOW: WINDOWS FILE EXPLORER ==================== -->
  <g transform="translate(950, 30)" filter="url(#winShadow8)">
    <rect width="930" height="480" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
