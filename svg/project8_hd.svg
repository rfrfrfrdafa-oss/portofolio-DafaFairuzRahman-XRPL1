<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Workstation Gradients -->
    <linearGradient id="p8DeskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="kaliDragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ubuntuLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="winShadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="terminalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Blinking Terminal Block Cursor Animation */
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-cursor { animation: blinkCursor 0.9s infinite; }

    /* Kali Dragon Glow Pulse */
    @keyframes dragonGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.8)); }
    }
    .dragon-art { animation: dragonGlow 3s infinite ease-in-out; }

    /* CRT Terminal Scanline Effect */
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1080px); }
    }
    .scan-beam { animation: scanline 8s linear infinite; }
  </style>

  <!-- Desktop Workstation Background Canvas -->
  <rect width="1920" height="1080" fill="url(#p8DeskBg)"/>

  <!-- ==================== TOP LEFT WINDOW: UBUNTU WSL FASTFETCH ==================== -->
  <g transform="translate(40, 30)" filter="url(#winShadow8)">
    <!-- Terminal Window Frame -->
    <rect width="880" height="480" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <rect width="880" height="32" rx="8" fill="#202023"/>
    <text x="16" y="21" font-family="'Consolas', monospace" font-size="13" fill="#9ca3af">dafa_fairuz_rahman@someone: ~</text>

    <!-- Ubuntu Orange ASCII Art Logo (from photo) -->
    <g transform="translate(30, 65)">
      <!-- Ubuntu Circular Dot & Arc Silhouette -->
      <g fill="#ea580c">
