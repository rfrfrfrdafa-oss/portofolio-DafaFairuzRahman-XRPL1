      <text x="0" y="236"><tspan fill="#38bdf8" font-weight="bold">Memory:</tspan> <tspan fill="#22c55e">680.02 MiB / 7.61 GiB (9%)</tspan></text>
      <text x="0" y="260"><tspan fill="#38bdf8" font-weight="bold">Disk (/):</tspan> <tspan fill="#e4e4e7">2.13 GiB / 1006.85 GiB (0%) - ext4</tspan></text>
