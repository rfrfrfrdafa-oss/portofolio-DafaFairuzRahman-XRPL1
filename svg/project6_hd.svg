<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>

    <filter id="neonGreenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="winBoxShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    /* Continuous 60-Second Real-Time Analog Clock Sweep Animation */
    @keyframes sweepSecond {
      0% { transform: rotate(285deg); }
      100% { transform: rotate(645deg); }
    }
    @keyframes sweepMinute {
      0% { transform: rotate(305deg); }
      100% { transform: rotate(665deg); }
    }
    @keyframes sweepHour {
      0% { transform: rotate(268deg); }
      100% { transform: rotate(628deg); }
    }

    .hand-sec { transform-origin: 360px 400px; animation: sweepSecond 60s linear infinite; }
    .hand-min { transform-origin: 360px 400px; animation: sweepMinute 3600s linear infinite; }
    .hand-hour { transform-origin: 360px 400px; animation: sweepHour 43200s linear infinite; }

    /* Neon Clock Rim Glow Pulse */
    @keyframes neonPulse {
      0%, 100% { filter: drop-shadow(0 0 8px #22c55e); }
      50% { filter: drop-shadow(0 0 16px #4ade80); }
    }
    .neon-ring { animation: neonPulse 3s infinite ease-in-out; }
  </style>

  <rect width="1080" height="1920" fill="#000000"/>

  <g transform="translate(180, 520)" filter="url(#winBoxShadow)">

    <rect x="0" y="0" width="720" height="880" fill="#141414" stroke="#94a3b8" stroke-width="4"/>

    <rect x="4" y="4" width="712" height="70" fill="#64748b"/>
    <text x="30" y="48" font-family="'Times New Roman', Times, serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="1">Jam Analog</text>

    <g transform="translate(640, 10)">
      <rect x="0" y="0" width="55" height="55" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="12" y1="12" x2="43" y2="43" stroke="#ffffff" stroke-width="3"/>
      <line x1="43" y1="12" x2="12" y2="43" stroke="#ffffff" stroke-width="3"/>
    </g>

    <g transform="translate(0, 74)">

      <text x="45" y="50" font-family="'Courier New', monospace" font-weight="700" font-size="24" fill="#4ade80">py.code</text>

      <g id="clockFace">

        <circle cx="360" cy="400" r="270" fill="#0f0f0f" stroke="#22c55e" stroke-width="5" class="neon-ring"/>

        <g font-family="'Courier New', monospace" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
          <text x="360" y="170">12</text>
          <text x="475" y="200">1</text>
          <text x="560" y="285">2</text>
          <text x="590" y="400">3</text>
          <text x="560" y="515">4</text>
          <text x="475" y="600">5</text>
          <text x="360" y="630">6</text>
          <text x="245" y="600">7</text>
          <text x="160" y="515">8</text>
          <text x="130" y="400">9</text>
          <text x="160" y="285">10</text>
          <text x="245" y="200">11</text>
        </g>

        <g stroke="#22c55e" stroke-width="4">
          <line x1="360" y1="130" x2="360" y2="150"/>
          <line x1="495" y1="166" x2="485" y2="183"/>
          <line x1="594" y1="265" x2="576" y2="275"/>
          <line x1="630" y1="400" x2="610" y2="400"/>
          <line x1="594" y1="535" x2="576" y2="525"/>
          <line x1="495" y1="634" x2="485" y2="617"/>
          <line x1="360" y1="670" x2="360" y2="650"/>
          <line x1="225" y1="634" x2="235" y2="617"/>
          <line x1="126" y1="535" x2="144" y2="525"/>
          <line x1="90" y1="400" x2="110" y2="400"/>
          <line x1="126" y1="265" x2="144" y2="275"/>
          <line x1="225" y1="166" x2="235" y2="183"/>
        </g>

        <g stroke="#ffffff" stroke-width="2" opacity="0.6">
          <line x1="388" y1="131" x2="387" y2="141"/>
          <line x1="416" y1="136" x2="413" y2="146"/>
          <line x1="443" y1="144" x2="438" y2="153"/>
          <line x1="469" y1="155" x2="463" y2="163"/>
          <line x1="520" y1="181" x2="512" y2="187"/>
          <line x1="544" y1="198" x2="534" y2="204"/>
          <line x1="565" y1="219" x2="554" y2="223"/>
          <line x1="583" y1="242" x2="571" y2="245"/>
          <line x1="612" y1="316" x2="602" y2="318"/>
          <line x1="621" y1="344" x2="611" y2="344"/>
          <line x1="626" y1="372" x2="616" y2="372"/>
          <line x1="626" y1="428" x2="616" y2="428"/>
          <line x1="621" y1="456" x2="611" y2="456"/>
          <line x1="612" y1="484" x2="602" y2="482"/>
          <line x1="583" y1="558" x2="571" y2="555"/>
          <line x1="565" y1="581" x2="554" y2="577"/>
          <line x1="544" y1="602" x2="534" y2="596"/>
          <line x1="520" y1="619" x2="512" y2="613"/>
        </g>

        <g class="hand-hour">
          <line x1="360" y1="400" x2="360" y2="250" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
        </g>

        <g class="hand-min">
          <line x1="360" y1="400" x2="360" y2="180" stroke="#22d3ee" stroke-width="9" stroke-linecap="round" filter="url(#neonGreenGlow)"/>
        </g>

        <g class="hand-sec">
          <line x1="360" y1="450" x2="360" y2="160" stroke="#ef4444" stroke-width="3.5"/>
          <circle cx="360" cy="450" r="6" fill="#ef4444"/>
        </g>

        <circle cx="360" cy="400" r="14" fill="#22c55e" stroke="#14532d" stroke-width="3"/>
      </g>

      <text x="360" y="735" font-family="'Courier New', monospace" font-weight="700" font-size="26" fill="#94a3b8" text-anchor="middle" letter-spacing="1">Sabtu, 12 Feb 2026</text>
    </g>
  </g>

  <g transform="translate(0, 1850)">

    <rect x="270" y="15" width="40" height="40" rx="10" fill="#64748b"/>

    <circle cx="540" cy="35" r="22" fill="none" stroke="#64748b" stroke-width="5"/>

    <polygon points="800,15 765,35 800,55" fill="#64748b"/>
  </g>
</svg>
