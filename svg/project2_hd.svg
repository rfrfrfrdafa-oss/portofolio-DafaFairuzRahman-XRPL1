<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 1080" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="p2BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="camBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="mainBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8b688"/>
      <stop offset="50%" stop-color="#e0946b"/>
      <stop offset="100%" stop-color="#bd6d4c"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="winGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    /* Interactivity and Dynamic CSS Animations */
    @keyframes scanLaser {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(680px); opacity: 0; }
    }
    .laser-line { animation: scanLaser 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

    @keyframes confidencePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.8)); }
    }
    .badge-confidence { animation: confidencePulse 2s infinite ease-in-out; transform-origin: 880px 755px; }

    @keyframes victoryPulse {
      0%, 100% { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5), 0 0 20px rgba(168, 85, 247, 0.3); }
      50% { text-shadow: 0 0 25px rgba(56, 189, 248, 0.9), 0 0 45px rgba(168, 85, 247, 0.7); }
    }
    .win-text { animation: victoryPulse 2.5s infinite ease-in-out; }

    @keyframes nodePulse {
      0%, 100% { r: 6.5; opacity: 0.9; }
      50% { r: 9; opacity: 1; }
    }
    .cv-node { animation: nodePulse 1.8s infinite ease-in-out; }
    .cv-bone { stroke: #22d3ee; stroke-width: 3.5; stroke-linecap: round; opacity: 0.85; }
  </style>

  <!-- Smartphone Canvas Screen (2160x1080) -->
  <rect width="2160" height="1080" fill="url(#p2BgGrad)"/>

  <!-- Top Mobile Status Bar (20:24, Battery, Network, VoLTE) -->
  <g transform="translate(48, 24)">
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#ffffff">20:24</text>
    <rect x="70" y="8" width="16" height="16" rx="4" fill="#64748b"/>
  </g>
  <g transform="translate(1620, 24)">
    <!-- Speed: 0,21 kB/d -->
    <text x="0" y="24" font-family="'Inter', sans-serif" font-size="20" fill="#cbd5e1">0,21 kB/d</text>
    <!-- Bluetooth -->
    <path d="M 125 10 L 133 18 L 129 22 L 129 2 L 133 6 Z" stroke="#ffffff" stroke-width="2" fill="none"/>
    <!-- VoLTE pill -->
    <rect x="150" y="8" width="46" height="20" rx="4" fill="#334155"/>
    <text x="173" y="22" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">VoLTE</text>
    <!-- Signal Bars -->
    <rect x="210" y="20" width="4" height="8" fill="#ffffff"/>
    <rect x="218" y="16" width="4" height="12" fill="#ffffff"/>
    <rect x="226" y="12" width="4" height="16" fill="#ffffff"/>
    <rect x="234" y="8" width="4" height="20" fill="#ffffff"/>
    <!-- WiFi Icon -->
    <path d="M 252 24 A 12 12 0 0 1 276 24 M 256 20 A 8 8 0 0 1 272 20 M 261 16 A 4 4 0 0 1 267 16" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <!-- Battery 43% Pill -->
    <rect x="290" y="8" width="56" height="22" rx="6" fill="#f59e0b"/>
    <rect x="346" y="14" width="4" height="10" rx="2" fill="#f59e0b"/>
    <text x="318" y="24" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#000000" text-anchor="middle">43</text>
    <!-- Green Dot Indicator -->
    <circle cx="370" cy="19" r="6" fill="#22c55e"/>
  </g>

  <!-- ==================== LEFT CARD: WEBCAM FEED & GESTURE RECOGNITION ==================== -->
  <g transform="translate(60, 90)">
    <!-- Container Card -->
    <rect x="0" y="0" width="940" height="920" rx="36" fill="#0f172a" stroke="#1e293b" stroke-width="2" filter="url(#cardShadow)"/>

    <!-- Inner Camera Viewport -->
    <g transform="translate(30, 30)">
      <clipPath id="camClip">
        <rect width="880" height="730" rx="28"/>
      </clipPath>
      
      <rect width="880" height="730" rx="28" fill="#1e293b"/>
      
      <!-- Video Frame Content inside clip -->
      <g clip-path="url(#camClip)">
        <!-- Wall Room Background in Photo -->
        <rect width="880" height="730" fill="#cdd9e5"/>
        <!-- Window Grille / Door frame on Right -->
        <rect x="740" y="0" width="140" height="730" fill="#94a3b8"/>
        <line x1="770" y1="0" x2="770" y2="730" stroke="#475569" stroke-width="12"/>
        <line x1="820" y1="0" x2="820" y2="730" stroke="#475569" stroke-width="12"/>
        <line x1="740" y1="200" x2="880" y2="200" stroke="#475569" stroke-width="12"/>
        <line x1="740" y1="400" x2="880" y2="400" stroke="#475569" stroke-width="12"/>

        <!-- Real Human Arm & Hand Silhouette Making Gunting (Peace Sign ✌️) -->
        <g id="humanHand" transform="translate(180, 70)">
          <!-- Forearm coming from bottom -->
          <path d="M 230 660 L 210 520 C 205 480, 220 440, 240 400 L 260 360 C 270 340, 290 330, 310 330 L 370 340 C 390 350, 410 380, 420 410 L 440 660 Z" fill="url(#handSkin)"/>
          
          <!-- Folded Ring and Pinky Fingers -->
          <path d="M 330 360 C 350 350, 390 360, 390 410 C 390 440, 370 470, 340 460 Z" fill="#cf7f57"/>
          <path d="M 350 410 C 370 410, 410 420, 410 470 C 410 500, 380 520, 350 510 Z" fill="#b96a43"/>

          <!-- Thumb wrapped across folded fingers -->
          <path d="M 210 460 C 180 430, 190 380, 240 370 C 290 360, 340 390, 350 440 C 360 480, 310 510, 270 510 C 240 510, 225 485, 210 460 Z" fill="url(#handSkin)" stroke="#a15634" stroke-width="2"/>

          <!-- Index Finger (Extended Upwards) -->
          <path d="M 255 350 L 235 150 C 230 110, 260 90, 285 90 C 310 90, 335 110, 330 150 L 320 340 Z" fill="url(#handSkin)" stroke="#a15634" stroke-width="2"/>

          <!-- Middle Finger (Extended Upwards) -->
          <path d="M 325 340 L 340 120 C 345 80, 375 60, 400 60 C 425 60, 450 80, 445 120 L 415 350 Z" fill="url(#handSkin)" stroke="#a15634" stroke-width="2"/>

          <!-- Finger Nails and Joint Wrinkles -->
          <ellipse cx="282" cy="115" rx="14" ry="18" fill="#ffedd5" opacity="0.6"/>
          <ellipse cx="395" cy="85" rx="14" ry="18" fill="#ffedd5" opacity="0.6"/>
          <path d="M 248 210 Q 282 220 318 210" stroke="#a15634" stroke-width="2" fill="none"/>
          <path d="M 345 180 Q 385 190 425 180" stroke="#a15634" stroke-width="2" fill="none"/>
        </g>

        <!-- MediaPipe 21 Hand Skeletal Landmark Computer Vision Tracking Overlay -->
        <g id="cvSkeleton" transform="translate(180, 70)" filter="url(#cyanGlow)">
          <!-- Wrist -->
          <circle cx="320" cy="560" r="7" fill="#22d3ee" class="cv-node"/>

          <!-- Thumb Bones: 1, 2, 3, 4 -->
          <line x1="320" y1="560" x2="260" y2="500" class="cv-bone"/>
          <line x1="260" y1="500" x2="230" y2="450" class="cv-bone"/>
          <line x1="230" y1="450" x2="250" y2="400" class="cv-bone"/>
          <line x1="250" y1="400" x2="290" y2="400" class="cv-bone"/>

          <!-- Index Finger Bones: 5, 6, 7, 8 (Extended) -->
          <line x1="320" y1="560" x2="290" y2="360" class="cv-bone"/>
          <line x1="290" y1="360" x2="280" y2="270" class="cv-bone"/>
          <line x1="280" y1="270" x2="275" y2="180" class="cv-bone"/>
          <line x1="275" y1="180" x2="282" y2="105" class="cv-bone"/>

          <!-- Middle Finger Bones: 9, 10, 11, 12 (Extended) -->
          <line x1="320" y1="560" x2="350" y2="350" class="cv-bone"/>
          <line x1="350" y1="350" x2="365" y2="260" class="cv-bone"/>
          <line x1="365" y1="260" x2="385" y2="170" class="cv-bone"/>
          <line x1="385" y1="170" x2="395" y2="80" class="cv-bone"/>

          <!-- Ring Finger Bones: 13, 14, 15, 16 (Folded) -->
          <line x1="320" y1="560" x2="390" y2="370" class="cv-bone"/>
          <line x1="390" y1="370" x2="370" y2="420" class="cv-bone"/>
          <line x1="370" y1="420" x2="340" y2="430" class="cv-bone"/>

          <!-- Pinky Bones: 17, 18, 19, 20 (Folded) -->
          <line x1="320" y1="560" x2="420" y2="400" class="cv-bone"/>
          <line x1="420" y1="400" x2="390" y2="460" class="cv-bone"/>
          <line x1="390" y1="460" x2="350" y2="470" class="cv-bone"/>

          <!-- Landmark Joint Dots -->
          <circle cx="260" cy="500" r="6" fill="#a855f7" class="cv-node"/>
          <circle cx="230" cy="450" r="6" fill="#a855f7" class="cv-node"/>
          <circle cx="250" cy="400" r="6" fill="#a855f7" class="cv-node"/>
          <circle cx="290" cy="400" r="7" fill="#38bdf8" class="cv-node"/>

          <circle cx="290" cy="360" r="6" fill="#38bdf8" class="cv-node"/>
          <circle cx="280" cy="270" r="6" fill="#38bdf8" class="cv-node"/>
          <circle cx="275" cy="180" r="6" fill="#38bdf8" class="cv-node"/>
          <circle cx="282" cy="105" r="8" fill="#22c55e" class="cv-node"/>

          <circle cx="350" cy="350" r="6" fill="#38bdf8" class="cv-node"/>
          <circle cx="365" cy="260" r="6" fill="#38bdf8" class="cv-node"/>
          <circle cx="385" cy="170" r="6" fill="#38bdf8" class="cv-node"/>
          <circle cx="395" cy="80" r="8" fill="#22c55e" class="cv-node"/>

          <circle cx="390" cy="370" r="6" fill="#f59e0b" class="cv-node"/>
          <circle cx="370" cy="420" r="6" fill="#f59e0b" class="cv-node"/>
          <circle cx="340" cy="430" r="6" fill="#f59e0b" class="cv-node"/>

          <circle cx="420" cy="400" r="6" fill="#f59e0b" class="cv-node"/>
          <circle cx="390" cy="460" r="6" fill="#f59e0b" class="cv-node"/>
          <circle cx="350" cy="470" r="6" fill="#f59e0b" class="cv-node"/>
        </g>

        <!-- Vertical Laser Scanning Bar Animation -->
        <g class="laser-line">
          <rect x="0" y="0" width="880" height="24" fill="url(#laserBeamGrad)"/>
          <line x1="0" y1="12" x2="880" y2="12" stroke="#22d3ee" stroke-width="2.5" filter="url(#cyanGlow)"/>
        </g>
      </g>

      <!-- Pill Badge: '89% yakin' (Bottom Right of Cam Stream) -->
      <g class="badge-confidence" transform="translate(680, 650)">
        <rect x="0" y="0" width="170" height="52" rx="26" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="85" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">89% yakin</text>
      </g>
    </g>

    <!-- Bottom Stream Details -->
    <g transform="translate(45, 790)">
      <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#38bdf8" letter-spacing="2">TERDETEKSI</text>
      <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="900" font-size="54" fill="#ffffff">Gunting</text>
    </g>

    <!-- 'Matikan Kamera' Button -->
    <g transform="translate(630, 810)">
      <rect x="0" y="0" width="270" height="68" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="135" y="43" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">Matikan Kamera</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: GAME ARENA & RESULT ==================== -->
  <g transform="translate(1040, 90)">
    <!-- Top Player Matchup Cards: KAMU vs AI -->
    <g transform="translate(0, 0)">
      <!-- Left Card: KAMU (Gunting ✌️) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="410" height="380" rx="36" fill="#111c30" stroke="#1e293b" stroke-width="2" filter="url(#cardShadow)"/>
        <text x="205" y="60" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="2">KAMU</text>
        
        <!-- Big 3D Yellow Emoji Gunting Hand ✌️ -->
        <g transform="translate(145, 95)">
          <circle cx="60" cy="90" r="75" fill="rgba(245, 158, 11, 0.1)"/>
          <!-- Wrist & Palm -->
          <path d="M 35 150 L 35 110 C 35 90, 50 85, 65 85 C 80 85, 95 95, 95 115 L 95 150 Z" fill="#fbbf24"/>
          <!-- Extended Index & Middle Fingers -->
          <rect x="25" y="25" width="26" height="85" rx="13" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/>
          <rect x="68" y="25" width="26" height="85" rx="13" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/>
          <!-- Thumb Folded -->
          <ellipse cx="60" cy="115" rx="25" ry="18" fill="#f59e0b"/>
        </g>
        <text x="205" y="325" font-family="'Inter', sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="middle">Gunting</text>
      </g>

      <!-- Center VS Badge -->
      <g transform="translate(440, 150)">
        <circle cx="45" cy="45" r="45" fill="#0f172a" stroke="#334155" stroke-width="2.5" filter="url(#cardShadow)"/>
        <text x="45" y="54" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">VS</text>
      </g>

      <!-- Right Card: AI (Kertas ✋) -->
      <g transform="translate(560, 0)">
        <rect x="0" y="0" width="410" height="380" rx="36" fill="#111c30" stroke="#1e293b" stroke-width="2" filter="url(#cardShadow)"/>
        <text x="205" y="60" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="2">AI</text>
        
        <!-- Big 3D Yellow Emoji Kertas Hand ✋ -->
        <g transform="translate(145, 95)">
          <circle cx="60" cy="90" r="75" fill="rgba(245, 158, 11, 0.1)"/>
          <!-- Palm -->
          <path d="M 25 150 L 25 100 C 25 80, 45 75, 60 75 C 75 75, 95 80, 95 100 L 95 150 Z" fill="#fbbf24"/>
          <!-- 4 Extended Fingers -->
          <rect x="15" y="30" width="20" height="75" rx="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
          <rect x="38" y="20" width="20" height="85" rx="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
          <rect x="62" y="22" width="20" height="83" rx="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
          <rect x="85" y="35" width="20" height="70" rx="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
          <!-- Thumb Outstretched -->
          <ellipse cx="10" cy="105" rx="12" ry="24" transform="rotate(-30 10 105)" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
        </g>
        <text x="205" y="325" font-family="'Inter', sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="middle">Kertas</text>
      </g>
    </g>

    <!-- Middle Result Card: Kamu menang! -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="970" height="240" rx="36" fill="#111c30" stroke="#1e293b" stroke-width="2" filter="url(#cardShadow)"/>
      <text x="485" y="60" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#64748b" text-anchor="middle" letter-spacing="3">HASIL</text>
      <text x="485" y="135" font-family="'Inter', sans-serif" font-weight="900" font-size="56" fill="#ffffff" text-anchor="middle" class="win-text">Kamu menang!</text>
      <text x="485" y="185" font-family="'Inter', sans-serif" font-weight="500" font-size="24" fill="#94a3b8" text-anchor="middle">Gunting mengalahkan Kertas.</text>
    </g>

    <!-- Bottom Play Button: 'Main Sekarang' & Netlify Badge -->
    <g transform="translate(0, 700)">
      <!-- Big Gradient Button -->
      <rect x="0" y="0" width="970" height="115" rx="40" fill="url(#mainBtnGrad)" filter="url(#cardShadow)"/>
      <text x="390" y="72" font-family="'Inter', sans-serif" font-weight="800" font-size="34" fill="#0f172a" text-anchor="middle">Main Sekarang</text>

      <!-- Netlify Tag Badge on Right -->
      <g transform="translate(640, 18)">
        <rect x="0" y="0" width="300" height="78" rx="39" fill="#0e1e25" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
        <!-- Netlify Spark Icon -->
        <g transform="translate(30, 22)">
          <polygon points="18,0 23,12 35,17 23,22 18,34 13,22 1,17 13,12" fill="#00c7b7"/>
          <circle cx="18" cy="17" r="3" fill="#ffffff"/>
        </g>
        <text x="75" y="47" font-family="'Inter', sans-serif" font-weight="600" font-size="21" fill="#cbd5e1">Powered by <tspan font-weight="800" fill="#ffffff">Netlify</tspan></text>
      </g>
    </g>
  </g>

  <!-- Far Right Android System Navigation Bar -->
  <g transform="translate(2080, 0)">
    <rect width="80" height="1080" fill="#050811"/>
    <!-- Back Triangle -->
    <polygon points="40,280 20,300 40,320" fill="#64748b"/>
    <!-- Home Circle -->
    <circle cx="30" cy="540" r="18" fill="none" stroke="#64748b" stroke-width="4"/>
    <!-- Recents Rounded Square -->
    <rect x="18" y="760" width="24" height="24" rx="6" fill="#64748b"/>
  </g>
</svg>