        <rect x="-72" y="-8" width="18" height="16" rx="3" fill="#ea580c"/>
        <rect x="54" y="-8" width="18" height="16" rx="3" fill="#ea580c"/>
        <rect x="-8" y="-72" width="16" height="18" rx="3" fill="#ea580c" transform="rotate(30)"/>
        <rect x="-8" y="-72" width="16" height="18" rx="3" fill="#ea580c" transform="rotate(60)"/>
        <rect x="-8" y="-72" width="16" height="18" rx="3" fill="#ea580c" transform="rotate(120)"/>
        <rect x="-8" y="-72" width="16" height="18" rx="3" fill="#ea580c" transform="rotate(150)"/>
        <rect x="-8" y="-72" width="16" height="18" rx="3" fill="#ea580c" transform="rotate(210)"/>
        <rect x="-8" y="-72" width="16" height="18" rx="3" fill="#ea580c" transform="rotate(240)"/>
        <rect x="-8" y="-72" width="16" height="18" rx="3" fill="#ea580c" transform="rotate(300)"/>
        <rect x="-8" y="-72" width="16" height="18" rx="3" fill="#ea580c" transform="rotate(330)"/>
