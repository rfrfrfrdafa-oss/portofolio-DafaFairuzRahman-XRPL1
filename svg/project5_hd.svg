<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 1080" width="100%" height="100%">
  <defs>

    <linearGradient id="p5DarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="aiButtonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="audioWaveTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gearOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <filter id="p5Glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    /* Continuous Gear Rotation in Video Preview */
    @keyframes gearSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .preview-gear { transform-origin: 880px 285px; animation: gearSpin 14s linear infinite; }

    /* Animated Red Playhead Scanning Across Timeline */
    @keyframes scrubPlayhead {
      0% { transform: translateX(0px); }
      100% { transform: translateX(650px); }
    }
    .timeline-scrubber { animation: scrubPlayhead 10s linear infinite; }

    /* Equalizer Waveform Dancing Animation */
    @keyframes eqWave {
      0%, 100% { transform: scaleY(0.7); }
      50% { transform: scaleY(1.3); }
    }
    .wave-bar-1 { transform-origin: bottom; animation: eqWave 0.7s infinite ease-in-out; }
    .wave-bar-2 { transform-origin: bottom; animation: eqWave 0.9s infinite ease-in-out 0.2s; }
    .wave-bar-3 { transform-origin: bottom; animation: eqWave 0.6s infinite ease-in-out 0.4s; }

    /* AI Button Pulse Glow */
    @keyframes aiPulse {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.5)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 25px rgba(217, 70, 239, 0.9)); transform: scale(1.06); }
    }
    .ai-btn-glow { transform-origin: 1820px 330px; animation: aiPulse 2.4s infinite ease-in-out; }
  </style>

  <rect width="2160" height="1080" fill="url(#p5DarkBg)"/>

  <g transform="translate(60, 40)" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <path d="M 30 15 L 10 35 L 30 55"/>

    <g transform="translate(5, 140)">
      <path d="M 25 25 A 15 15 0 1 0 10 10"/>
