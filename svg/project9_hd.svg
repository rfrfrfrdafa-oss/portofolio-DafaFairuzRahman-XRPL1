<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <!-- Wooden Workbench Surface -->
    <linearGradient id="woodBench" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b3e1f"/>
      <stop offset="48%" stop-color="#7c4a26"/>
      <stop offset="50%" stop-color="#3b200e"/>
      <stop offset="52%" stop-color="#85512b"/>
      <stop offset="100%" stop-color="#653b1d"/>
    </linearGradient>
    <linearGradient id="arduinoBoard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#008793"/>
      <stop offset="100%" stop-color="#005f6b"/>
    </linearGradient>
    <linearGradient id="lcdBacklight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="50%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="servoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="sensorDome" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <filter id="benchShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="lcdGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ledGlowOrange" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sonarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blinkTx {
      0%, 40% { opacity: 1; }
      45%, 100% { opacity: 0.25; }
    }
    @keyframes sonarPulse {
      0% { transform: scale(0.45); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes lcdBreathe {
      0%, 100% { opacity: 0.94; }
      50% { opacity: 1; }
    }
    @keyframes servoSweep {
      0%, 100% { transform: rotate(-55deg); }
      50% { transform: rotate(55deg); }
    }
    @keyframes badgePulse {
      0%, 100% { opacity: 0.78; }
      50% { opacity: 1; }
    }
    .tx-led { animation: blinkTx 0.55s infinite ease-in-out; }
    .rx-led { animation: blinkTx 0.85s infinite ease-in-out 0.2s; }
    .lcd-screen { animation: lcdBreathe 2.8s infinite ease-in-out; }
    .sonar-wave-1 {
      transform-box: fill-box;
      transform-origin: center;
      animation: sonarPulse 2.1s infinite ease-out;
    }
    .sonar-wave-2 {
      transform-box: fill-box;
      transform-origin: center;
      animation: sonarPulse 2.1s infinite ease-out 0.7s;
    }
    .sonar-wave-3 {
      transform-box: fill-box;
      transform-origin: center;
      animation: sonarPulse 2.1s infinite ease-out 1.4s;
    }
    .servo-horn {
      transform-box: view-box;
      transform-origin: 730px 1372px;
      animation: servoSweep 3.4s infinite ease-in-out;
    }
    .live-dot { animation: badgePulse 1.4s infinite ease-in-out; }
  </style>

  <!-- Workbench Surface -->
  <rect width="1200" height="1600" fill="url(#woodBench)"/>
  <g stroke="#4a2810" stroke-width="2" opacity="0.35">
    <line x1="0" y1="220" x2="1200" y2="225"/>
    <line x1="0" y1="560" x2="1200" y2="555"/>
    <line x1="0" y1="910" x2="1200" y2="918"/>
    <line x1="0" y1="1260" x2="1200" y2="1254"/>
    <line x1="712" y1="0" x2="706" y2="1600" stroke="#261205" stroke-width="5" opacity="0.7"/>
  </g>

  <!-- Subtle Hardware Status HUD Pill -->
  <g transform="translate(40, 36)">
    <rect width="375" height="52" rx="26" fill="rgba(11,15,25,0.84)" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="30" cy="26" r="7" fill="#22c55e" class="live-dot"/>
    <text x="50" y="32" font-family="'Consolas', monospace" font-size="18" font-weight="bold" fill="#e2e8f0">ARDUINO UNO • LIVE BENCH</text>
  </g>

  <!-- ==================== ARDUINO UNO R3 BOARD (TOP LEFT) ==================== -->
  <g transform="translate(185, 110)" filter="url(#benchShadow)">
    <!-- Blue USB-B Cable -->
    <rect x="135" y="-110" width="44" height="105" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <rect x="128" y="-35" width="58" height="40" rx="4" fill="#0ea5e9"/>
    <!-- Metallic USB-B Port -->
    <rect x="124" y="5" width="66" height="56" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <!-- PCB Base -->
    <rect x="10" y="36" width="235" height="315" rx="10" fill="url(#arduinoBoard)" stroke="#0369a1" stroke-width="3"/>
    <!-- Barrel Power Jack -->
    <rect x="36" y="16" width="48" height="60" rx="4" fill="#1e293b"/>
    <!-- Pin Headers Left & Right -->
    <rect x="20" y="105" width="22" height="220" rx="3" fill="#0f172a"/>
    <rect x="210" y="80" width="22" height="245" rx="3" fill="#0f172a"/>
    <!-- ATmega328P Chip -->
    <rect x="85" y="148" width="62" height="150" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="116" cy="160" r="6" fill="#475569"/>
    <text x="116" y="232" transform="rotate(-90 116 232)" text-anchor="middle" font-family="'Consolas', monospace" font-size="14" fill="#94a3b8">ATMEGA328P</text>
    <!-- Uno Branding -->
    <text x="155" y="128" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#ffffff">UNO</text>
    <text x="152" y="146" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#bae6fd">ARDUINO</text>
    <!-- Status LEDs -->
    <circle cx="182" cy="176" r="6" fill="#22c55e" filter="url(#ledGlowOrange)"/>
    <text x="164" y="180" font-family="'Consolas', monospace" font-size="10" fill="#fff">ON</text>
    <circle cx="182" cy="202" r="5" fill="#f97316" filter="url(#ledGlowOrange)" class="tx-led"/>
    <text x="164" y="206" font-family="'Consolas', monospace" font-size="10" fill="#fff">TX</text>
    <circle cx="182" cy="224" r="5" fill="#facc15" filter="url(#ledGlowOrange)" class="rx-led"/>
    <text x="164" y="228" font-family="'Consolas', monospace" font-size="10" fill="#fff">RX</text>
  </g>

  <!-- ==================== MINI BREADBOARD (CENTER LEFT) ==================== -->
  <g transform="translate(275, 595) rotate(-36)" filter="url(#benchShadow)">
    <rect width="175" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="12" y1="64" x2="163" y2="64" stroke="#e2e8f0" stroke-width="5"/>
    <g fill="#334155">
      <circle cx="24" cy="22" r="3"/><circle cx="42" cy="22" r="3"/><circle cx="60" cy="22" r="3"/><circle cx="78" cy="22" r="3"/><circle cx="96" cy="22" r="3"/><circle cx="114" cy="22" r="3"/><circle cx="132" cy="22" r="3"/><circle cx="150" cy="22" r="3"/>
      <circle cx="24" cy="38" r="3"/><circle cx="42" cy="38" r="3"/><circle cx="60" cy="38" r="3"/><circle cx="78" cy="38" r="3"/><circle cx="96" cy="38" r="3"/><circle cx="114" cy="38" r="3"/><circle cx="132" cy="38" r="3"/><circle cx="150" cy="38" r="3"/>
      <circle cx="24" cy="90" r="3"/><circle cx="42" cy="90" r="3"/><circle cx="60" cy="90" r="3"/><circle cx="78" cy="90" r="3"/><circle cx="96" cy="90" r="3"/><circle cx="114" cy="90" r="3"/><circle cx="132" cy="90" r="3"/><circle cx="150" cy="90" r="3"/>
      <circle cx="24" cy="106" r="3"/><circle cx="42" cy="106" r="3"/><circle cx="60" cy="106" r="3"/><circle cx="78" cy="106" r="3"/><circle cx="96" cy="106" r="3"/><circle cx="114" cy="106" r="3"/><circle cx="132" cy="106" r="3"/><circle cx="150" cy="106" r="3"/>
    </g>
  </g>

  <!-- ==================== HC-SR04 ULTRASONIC SENSOR (MID LEFT) ==================== -->
  <g transform="translate(150, 745) rotate(-32)" filter="url(#benchShadow)">
    <rect width="205" height="92" rx="6" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>
    <!-- Left & Right Transducers -->
    <circle cx="52" cy="46" r="32" fill="url(#sensorDome)" stroke="#475569" stroke-width="3"/>
    <circle cx="52" cy="46" r="21" fill="#1e293b"/>
    <circle cx="52" cy="46" r="9" fill="#0f172a"/>
    <circle cx="153" cy="46" r="32" fill="url(#sensorDome)" stroke="#475569" stroke-width="3"/>
    <circle cx="153" cy="46" r="21" fill="#1e293b"/>
    <circle cx="153" cy="46" r="9" fill="#0f172a"/>
    <!-- Crystal -->
    <rect x="88" y="8" width="28" height="12" rx="5" fill="#cbd5e1"/>
    <text x="102" y="82" text-anchor="middle" font-family="'Consolas', monospace" font-weight="bold" font-size="13" fill="#ffffff">HC-SR04</text>
    <!-- 4 Header Pins -->
    <rect x="80" y="92" width="44" height="14" rx="2" fill="#0f172a"/>
  </g>

  <!-- Animated Ultrasonic Sonar Waves -->
  <g filter="url(#sonarGlow)" fill="none" stroke="#38bdf8" stroke-width="3">
    <circle cx="240" cy="740" r="46" class="sonar-wave-1"/>
    <circle cx="240" cy="740" r="46" class="sonar-wave-2"/>
    <circle cx="240" cy="740" r="46" class="sonar-wave-3"/>
  </g>

  <!-- ==================== 16x2 I2C LCD MODULE (RIGHT) ==================== -->
  <g transform="translate(715, 370) rotate(22)" filter="url(#benchShadow)">
    <!-- Green PCB Frame -->
    <rect width="340" height="156" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="2.5"/>
    <!-- Corner Mounting Holes -->
    <circle cx="14" cy="14" r="5" fill="#fde047"/>
    <circle cx="326" cy="14" r="5" fill="#fde047"/>
    <circle cx="14" cy="142" r="5" fill="#fde047"/>
    <circle cx="326" cy="142" r="5" fill="#fde047"/>
    <!-- Metal Bezel -->
    <rect x="22" y="22" width="296" height="112" rx="4" fill="#1e293b"/>
    <!-- Glowing Yellow-Green LCD Panel -->
    <rect x="32" y="32" width="276" height="92" rx="3" fill="url(#lcdBacklight)" filter="url(#lcdGlow)" class="lcd-screen"/>
    <!-- Crisp Digital Telemetry Readout -->
    <text x="48" y="68" font-family="'Consolas', monospace" font-weight="bold" font-size="25" fill="#1a2e05">DIST: 18.4 cm</text>
    <text x="48" y="106" font-family="'Consolas', monospace" font-weight="bold" font-size="24" fill="#365314">SERVO: 90 deg</text>
  </g>

  <!-- ==================== JUMPER WIRES ==================== -->
  <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- Arduino to LCD Wires -->
    <path d="M 412 315 C 510 290, 610 310, 725 385" stroke="#facc15"/>
    <path d="M 412 332 C 505 320, 615 340, 718 402" stroke="#f8fafc"/>
    <path d="M 412 348 C 495 365, 620 385, 712 420" stroke="#ef4444"/>
    <path d="M 412 365 C 470 430, 560 475, 706 435" stroke="#dc2626"/>
    <!-- Arduino to Breadboard Wires -->
    <path d="M 218 330 C 120 420, 180 565, 315 620" stroke="#f97316"/>
    <path d="M 225 360 C 140 460, 220 570, 330 612" stroke="#a855f7"/>
    <path d="M 235 390 C 175 495, 250 580, 345 604" stroke="#22c55e"/>
    <!-- Breadboard to Ultrasonic -->
    <path d="M 295 660 C 260 695, 245 730, 232 765" stroke="#eab308"/>
    <path d="M 315 675 C 280 715, 270 740, 258 778" stroke="#16a34a"/>
    <!-- Arduino / Breadboard Long Leads down to Servo SG90 -->
    <path d="M 215 845 C 320 980, 795 1040, 755 1390" stroke="#f97316"/>
    <path d="M 222 852 C 325 990, 785 1050, 745 1395" stroke="#dc2626"/>
    <path d="M 210 858 C 310 998, 775 1060, 735 1400" stroke="#78350f"/>
  </g>

  <!-- ==================== SG90 MICRO SERVO MOTOR (BOTTOM RIGHT) ==================== -->
  <g filter="url(#benchShadow)">
    <!-- Mounting Tabs -->
    <rect x="652" y="1392" width="142" height="22" rx="4" fill="#2563eb"/>
    <!-- Blue Translucent Servo Body -->
    <rect x="678" y="1352" width="90" height="128" rx="8" fill="url(#servoBody)" stroke="#1e40af" stroke-width="2.5"/>
    <!-- Label Sticker -->
    <rect x="692" y="1408" width="62" height="52" rx="3" fill="#0f172a"/>
    <text x="723" y="1431" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14" fill="#facc15">SG90</text>
    <text x="723" y="1449" text-anchor="middle" font-family="'Consolas', monospace" font-size="10" fill="#cbd5e1">MicroServo</text>
    <!-- Gear Collar -->
    <circle cx="730" cy="1372" r="20" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
  </g>

  <!-- Rotating White Servo Horn Arm -->
  <g class="servo-horn">
    <path d="M 720 1372 C 720 1362, 740 1362, 740 1372 L 736 1315 C 735 1308, 725 1308, 724 1315 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="730" cy="1372" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="730" cy="1372" r="3" fill="#475569"/>
  </g>

  <!-- Bottom Hardware Components Legend -->
  <g transform="translate(40, 1495)">
    <rect width="545" height="64" rx="14" fill="rgba(11,15,25,0.85)" stroke="rgba(14,165,233,0.4)" stroke-width="1.5"/>
    <text x="24" y="28" font-family="'Consolas', monospace" font-weight="bold" font-size="16" fill="#38bdf8">HARDWARE STACK:</text>
    <text x="24" y="50" font-family="'Segoe UI', sans-serif" font-size="15" fill="#e2e8f0">Arduino Uno • HC-SR04 Ultrasonic • 16x2 LCD • Servo SG90</text>
  </g>
</svg>
