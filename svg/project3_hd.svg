<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <!-- Background & Soil Gradients -->
    <radialGradient id="gardenGround" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3f2e21"/>
      <stop offset="45%" stop-color="#2a1f17"/>
      <stop offset="100%" stop-color="#18110b"/>
    </radialGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c25e38"/>
      <stop offset="60%" stop-color="#9a3e1b"/>
      <stop offset="100%" stop-color="#6e250c"/>
    </linearGradient>
    <linearGradient id="woodPlank" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Transparent Bottle & Water Gradients -->
    <linearGradient id="bottleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.5"/>
      <stop offset="15%" stop-color="#bae6fd" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="nutrientWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="pinkShears" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="hudGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Swaying Organic Leaf CSS Animation */
    @keyframes swaySoft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2.5deg); }
    }
    @keyframes swayCounter {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-3deg); }
    }
    .sway-1 { transform-origin: 540px 920px; animation: swaySoft 4.5s ease-in-out infinite; }
    .sway-2 { transform-origin: 520px 900px; animation: swayCounter 5.2s ease-in-out infinite 0.5s; }
    .sway-3 { transform-origin: 560px 880px; animation: swaySoft 3.8s ease-in-out infinite 1s; }

    /* Rising Bubbles in Nutrient Water */
    @keyframes bubbleRise {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-160px); opacity: 0; }
    }
    .bubble-1 { animation: bubbleRise 3s infinite linear; }
    .bubble-2 { animation: bubbleRise 4.2s infinite linear 1s; }
    .bubble-3 { animation: bubbleRise 2.8s infinite linear 1.8s; }

    /* Telemetry Pulse */
    @keyframes hudPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.5; }
    }
    .hud-blink { animation: hudPulse 2s infinite ease-in-out; }
  </style>

  <!-- Garden Paving Ground Background (from photo) -->
  <rect width="1080" height="1920" fill="url(#gardenGround)"/>

  <!-- Terra Cotta Bricks (Bottom Right of photo) -->
  <g transform="translate(760, 1480)" filter="url(#softShadow)">
    <rect x="0" y="0" width="300" height="90" rx="8" fill="url(#brickGrad)"/>
    <rect x="0" y="105" width="300" height="90" rx="8" fill="url(#brickGrad)"/>
    <rect x="0" y="210" width="300" height="90" rx="8" fill="url(#brickGrad)"/>
    <rect x="0" y="315" width="300" height="90" rx="8" fill="url(#brickGrad)"/>
  </g>

  <!-- Wooden Plank & Pot in Background (Top) -->
  <g transform="translate(180, 40)" filter="url(#softShadow)">
    <!-- Yellow Basin / Pot from photo -->
    <ellipse cx="220" cy="80" rx="180" ry="60" fill="#fef08a" stroke="#ca8a04" stroke-width="6"/>
    <ellipse cx="220" cy="80" rx="150" ry="45" fill="#451a03"/>
    <!-- Wooden stake / post -->
    <rect x="520" y="0" width="70" height="360" rx="6" fill="url(#woodPlank)" transform="rotate(-12 520 0)"/>
  </g>

  <!-- Wooden Board beside bottle (Middle Right) -->
  <g transform="translate(540, 1340)" filter="url(#softShadow)">
    <rect x="0" y="0" width="460" height="150" rx="12" fill="url(#woodPlank)" transform="rotate(-8)"/>
  </g>

  <!-- Pink Pruning Shears / Pliers (from photo, next to bottle) -->
  <g transform="translate(620, 1020) rotate(15)" filter="url(#softShadow)">
    <!-- Stainless steel blade tips -->
    <polygon points="30,0 45,60 15,60" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <polygon points="60,0 75,60 45,60" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <circle cx="45" cy="65" r="9" fill="#334155"/>
    <!-- Pink Curved Ergonomic Handles -->
    <path d="M 30 75 C 10 130, 0 200, 30 260 C 45 285, 70 270, 60 240 C 40 190, 50 140, 55 80 Z" fill="url(#pinkShears)"/>
    <path d="M 60 75 C 80 130, 90 200, 60 260 C 45 285, 20 270, 30 240 C 50 190, 40 140, 35 80 Z" fill="url(#pinkShears)" transform="translate(70, 0) scale(-1, 1)"/>
    <circle cx="35" cy="180" r="8" fill="#fda4af"/>
    <circle cx="55" cy="180" r="8" fill="#fda4af"/>
  </g>

  <!-- ==================== UPRIGHT LE MINERALE GALLON BOTTLE ==================== -->
  <g id="leMineraleBottle" transform="translate(140, 380)" filter="url(#softShadow)">
    <!-- Shadow beneath bottle -->
    <ellipse cx="400" cy="1080" rx="320" ry="90" fill="#0c0704" opacity="0.8"/>

    <!-- Bottom Bottle Body (Cylindrical Cut Plastic Reservoir) -->
    <path d="M 120 460 
             C 110 520, 100 600, 100 780 
             C 100 960, 140 1060, 400 1060 
             C 660 1060, 700 960, 700 780 
             C 700 600, 690 520, 680 460 Z" fill="url(#nutrientWater)"/>

    <!-- Plastic Walls & Ribbed Rings -->
    <path d="M 120 460 
             C 110 520, 100 600, 100 780 
             C 100 960, 140 1060, 400 1060 
             C 660 1060, 700 960, 700 780 
             C 700 600, 690 520, 680 460 Z" fill="url(#bottleGlass)" stroke="#38bdf8" stroke-width="4"/>

    <!-- Bottle Cut Rim Edge (Top Opening) -->
    <ellipse cx="400" cy="460" rx="280" ry="45" fill="none" stroke="#bae6fd" stroke-width="6"/>
    <ellipse cx="400" cy="460" rx="275" ry="42" fill="rgba(224, 242, 254, 0.2)"/>

    <!-- Ribbed Contour Bands of Gallon -->
    <ellipse cx="400" cy="620" rx="290" ry="35" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3"/>
    <ellipse cx="400" cy="780" rx="295" ry="35" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3"/>
    <ellipse cx="400" cy="940" rx="280" ry="32" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="3"/>

    <!-- Authentic 'Le Minerale' Label Tag Band -->
    <g transform="translate(180, 680)">
      <rect x="0" y="0" width="300" height="95" rx="10" fill="#ffffff" opacity="0.9" filter="url(#softShadow)"/>
      <!-- Le Minerale Mountain Red & Blue Logo Silhouette -->
      <path d="M 25 70 L 60 25 L 95 70 Z" fill="#ef4444"/>
      <path d="M 75 70 L 105 35 L 135 70 Z" fill="#0284c7"/>
      <text x="145" y="55" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#0284c7" font-style="italic">Le</text>
      <text x="145" y="80" font-family="'Inter', sans-serif" font-weight="800" font-size="24" fill="#ef4444">Minerale</text>
    </g>

    <!-- Submerged Root System in Nutrient Water -->
    <g id="roots" stroke="#fef08a" stroke-width="2.5" opacity="0.8" fill="none" stroke-linecap="round">
      <path d="M 320 650 Q 300 750 280 880 T 260 980"/>
      <path d="M 360 660 Q 350 780 340 920 T 320 1020"/>
      <path d="M 400 650 Q 400 800 410 940 T 420 1030"/>
      <path d="M 440 660 Q 460 790 480 930 T 500 1010"/>
      <path d="M 480 650 Q 510 770 540 890 T 560 990"/>
      <!-- Lateral secondary root filaments -->
      <path d="M 300 750 L 260 790 M 340 820 L 310 860 M 410 800 L 450 840 M 470 780 L 510 820 M 520 860 L 560 900"/>
    </g>

    <!-- Aeration Micro Bubbles Rising (Animated) -->
    <g transform="translate(380, 880)">
      <circle cx="0" cy="0" r="5" fill="#ffffff" class="bubble-1"/>
      <circle cx="45" cy="20" r="7" fill="#ffffff" class="bubble-2"/>
      <circle cx="-35" cy="40" r="6" fill="#ffffff" class="bubble-3"/>
      <circle cx="20" cy="60" r="4" fill="#ffffff" class="bubble-1"/>
    </g>

    <!-- Supporting Wooden Chopsticks / Bamboo Skewers in photo -->
    <line x1="220" y1="450" x2="260" y2="580" stroke="#fef08a" stroke-width="8" stroke-linecap="round"/>
    <line x1="230" y1="450" x2="270" y2="580" stroke="#fde047" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ==================== VIBRANT WATER SPINACH (KANGKUNG) PLANTS ==================== -->
  <!-- Layer 1: Background Stalks & Leaves -->
  <g class="sway-2" transform="translate(140, 380)">
    <!-- Stems -->
    <path d="M 300 520 Q 240 380 180 240" stroke="#22c55e" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 360 520 Q 320 340 280 180" stroke="#16a34a" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M 440 520 Q 480 340 520 180" stroke="#16a34a" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M 480 520 Q 560 380 640 240" stroke="#22c55e" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- Arrow-shaped pointed Kangkung Leaves (Ipomoea aquatica) -->
    <!-- Leaf Left Upper -->
    <g transform="translate(180, 240) rotate(-35)">
      <path d="M 0 0 C -35 -60, -40 -160, 0 -240 C 40 -160, 35 -60, 0 0 Z" fill="url(#leafDark)"/>
      <line x1="0" y1="0" x2="0" y2="-220" stroke="#86efac" stroke-width="2.5"/>
    </g>
    <!-- Leaf Center Left -->
    <g transform="translate(280, 180) rotate(-15)">
      <path d="M 0 0 C -40 -70, -45 -180, 0 -260 C 45 -180, 40 -70, 0 0 Z" fill="url(#leafGrad)"/>
      <line x1="0" y1="0" x2="0" y2="-240" stroke="#86efac" stroke-width="3"/>
    </g>
    <!-- Leaf Center Right -->
    <g transform="translate(520, 180) rotate(15)">
      <path d="M 0 0 C -40 -70, -45 -180, 0 -260 C 45 -180, 40 -70, 0 0 Z" fill="url(#leafGrad)"/>
      <line x1="0" y1="0" x2="0" y2="-240" stroke="#86efac" stroke-width="3"/>
    </g>
    <!-- Leaf Right Upper -->
    <g transform="translate(640, 240) rotate(35)">
      <path d="M 0 0 C -35 -60, -40 -160, 0 -240 C 40 -160, 35 -60, 0 0 Z" fill="url(#leafDark)"/>
      <line x1="0" y1="0" x2="0" y2="-220" stroke="#86efac" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Layer 2: Foreground Stalks & Bushy Cluster -->
  <g class="sway-1" transform="translate(140, 380)">
    <!-- Central Main Stems -->
    <path d="M 380 500 Q 360 300 370 120" stroke="#4ade80" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M 420 500 Q 440 300 430 110" stroke="#4ade80" stroke-width="15" fill="none" stroke-linecap="round"/>

    <!-- Big Center Crown Leaves -->
    <g transform="translate(370, 120) rotate(-5)">
      <path d="M 0 0 C -45 -80, -50 -200, 0 -290 C 50 -200, 45 -80, 0 0 Z" fill="url(#leafGrad)" filter="url(#softShadow)"/>
      <line x1="0" y1="0" x2="0" y2="-270" stroke="#bbf7d0" stroke-width="3.5"/>
    </g>
    <g transform="translate(430, 110) rotate(8)">
      <path d="M 0 0 C -45 -80, -50 -200, 0 -290 C 50 -200, 45 -80, 0 0 Z" fill="url(#leafGrad)" filter="url(#softShadow)"/>
      <line x1="0" y1="0" x2="0" y2="-270" stroke="#bbf7d0" stroke-width="3.5"/>
    </g>

    <!-- Side Branching Leaves -->
    <g transform="translate(290, 320) rotate(-45)">
      <path d="M 0 0 C -30 -50, -35 -140, 0 -200 C 35 -140, 30 -50, 0 0 Z" fill="url(#leafGrad)"/>
      <line x1="0" y1="0" x2="0" y2="-180" stroke="#bbf7d0" stroke-width="2.5"/>
    </g>
    <g transform="translate(510, 310) rotate(45)">
      <path d="M 0 0 C -30 -50, -35 -140, 0 -200 C 35 -140, 30 -50, 0 0 Z" fill="url(#leafGrad)"/>
      <line x1="0" y1="0" x2="0" y2="-180" stroke="#bbf7d0" stroke-width="2.5"/>
    </g>
  </g>

  <!-- ==================== SMART ECO-TECH IoT TELEMETRY HUD ==================== -->
  <g transform="translate(50, 60)" filter="url(#hudGlow)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="340" height="56" rx="28" fill="rgba(15, 23, 42, 0.85)" stroke="#22c55e" stroke-width="2"/>
    <circle cx="30" cy="28" r="8" fill="#22c55e" class="hud-blink"/>
    <text x="54" y="36" font-family="'Inter', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="2">SMART ECO-TECH</text>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(680, 60)" filter="url(#hudGlow)">
    <rect x="0" y="0" width="350" height="230" rx="24" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="44" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="1.5">TELEMETRY SENSOR</text>
    
    <!-- pH Value -->
    <text x="30" y="85" font-family="'Inter', sans-serif" font-weight="500" font-size="18" fill="#cbd5e1">pH Air:</text>
    <text x="320" y="85" font-family="'Consolas', monospace" font-weight="700" font-size="22" fill="#22c55e" text-anchor="end">6.45 (Optimal)</text>

    <!-- EC Conductivity -->
    <text x="30" y="130" font-family="'Inter', sans-serif" font-weight="500" font-size="18" fill="#cbd5e1">EC Nutrisi:</text>
    <text x="320" y="130" font-family="'Consolas', monospace" font-weight="700" font-size="22" fill="#38bdf8" text-anchor="end">1.82 mS/cm</text>

    <!-- Water Temp -->
    <text x="30" y="175" font-family="'Inter', sans-serif" font-weight="500" font-size="18" fill="#cbd5e1">Suhu Air:</text>
    <text x="320" y="175" font-family="'Consolas', monospace" font-weight="700" font-size="22" fill="#facc15" text-anchor="end">24.6°C</text>

    <!-- Water Reservoir Level -->
    <g transform="translate(30, 195)">
      <rect x="0" y="0" width="290" height="12" rx="6" fill="#1e293b"/>
      <rect x="0" y="0" width="245" height="12" rx="6" fill="#38bdf8"/>
    </g>
  </g>
</svg>