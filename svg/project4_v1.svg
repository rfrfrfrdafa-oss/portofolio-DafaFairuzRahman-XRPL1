<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <filter id="p4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#p4Bg)"/>

  <!-- Top Title HUD Bar -->
  <rect x="48" y="44" width="1824" height="64" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="80" cy="76" r="8" fill="#3b82f6" filter="url(#p4Glow)"/>
  <text x="105" y="82" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">HARDWARE ENGINEERING &amp; PC DIAGNOSTICS ARCHITECTURE</text>
  <text x="750" y="82" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600">PROJECT 04: MOTHERBOARD ANATOMY, PC ASSEMBLY &amp; TEARDOWN</text>
  <rect x="1560" y="56" width="140" height="40" rx="8" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1"/>
  <text x="1630" y="81" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ULTRA HD 1080P</text>
  <rect x="1715" y="56" width="135" height="40" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="1782" y="81" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">POST STATUS: AA</text>

  <!-- Left: Asus Micro-ATX Motherboard CAD Blueprint -->
  <g transform="translate(68, 140)">
    <rect x="0" y="0" width="872" height="760" rx="18" fill="#090d16" stroke="#1d4ed8" stroke-width="2"/>
    <text x="35" y="45" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" letter-spacing="1">MOTHERBOARD COMPONENT TOPOGRAPHY &amp; PINOUTS</text>

    <!-- Motherboard PCB Base -->
    <g transform="translate(140, 75)">
      <rect x="0" y="0" width="590" height="640" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="2"/>
      
      <!-- CPU Socket (LGA / AM4) -->
      <g transform="translate(190, 80)">
        <rect x="0" y="0" width="190" height="190" rx="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
        <rect x="25" y="25" width="140" height="140" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
        <text x="95" y="100" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="800" text-anchor="middle">LGA CPU SOCKET</text>
        <text x="95" y="120" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">115X / AM4 PIN ARRAY</text>
      </g>

      <!-- VRM Power Phase Chokes & Capacitors -->
      <g transform="translate(70, 75)">
        <rect x="0" y="0" width="85" height="200" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="42" y="105" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 42 105)">6+2 PHASE VRM</text>
        <!-- Chokes -->
        <rect x="15" y="15" width="55" height="30" rx="4" fill="#0f172a" stroke="#64748b"/>
        <rect x="15" y="55" width="55" height="30" rx="4" fill="#0f172a" stroke="#64748b"/>
        <rect x="15" y="95" width="55" height="30" rx="4" fill="#0f172a" stroke="#64748b"/>
        <rect x="15" y="135" width="55" height="30" rx="4" fill="#0f172a" stroke="#64748b"/>
      </g>

      <!-- Dual Channel DDR3/DDR4 RAM Slots -->
      <g transform="translate(420, 60)">
        <!-- Slot 1 (Blue) -->
        <rect x="0" y="0" width="28" height="260" rx="4" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
        <line x1="14" y1="10" x2="14" y2="250" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 3"/>
        <!-- Slot 2 (Black) -->
        <rect x="42" y="0" width="28" height="260" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <line x1="56" y1="10" x2="56" y2="250" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
        <!-- Slot 3 (Blue) -->
        <rect x="84" y="0" width="28" height="260" rx="4" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
        <line x1="98" y1="10" x2="98" y2="250" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 3"/>
        <!-- Slot 4 (Black) -->
        <rect x="126" y="0" width="28" height="260" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
        <line x1="140" y1="10" x2="140" y2="250" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
        <text x="77" y="295" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">DUAL-CHANNEL DDR3/DDR4</text>
      </g>

      <!-- PCIe 3.0 x16 Primary Graphics Card Slot -->
      <g transform="translate(50, 360)">
        <rect x="0" y="0" width="460" height="34" rx="4" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2" filter="url(#p4Glow)"/>
        <line x1="15" y1="17" x2="445" y2="17" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 3"/>
        <text x="230" y="22" fill="#ffffff" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">PCIe 3.0 x16 EXPANSION INTERFACE (15.75 GB/s)</text>
      </g>

      <!-- PCIe x1 Slots -->
      <g transform="translate(50, 420)">
        <rect x="0" y="0" width="140" height="24" rx="4" fill="#1e293b" stroke="#475569"/>
        <text x="70" y="16" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">PCIe x1 (WIFI)</text>
      </g>

      <!-- PCH Southbridge Anodized Aluminum Heatsink -->
      <g transform="translate(380, 430)">
        <rect x="0" y="0" width="160" height="150" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
        <g stroke="#0369a1" stroke-width="4">
          <line x1="20" y1="20" x2="140" y2="20"/><line x1="20" y1="45" x2="140" y2="45"/>
          <line x1="20" y1="70" x2="140" y2="70"/><line x1="20" y1="95" x2="140" y2="95"/>
          <line x1="20" y1="120" x2="140" y2="120"/>
        </g>
        <text x="80" y="80" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" text-anchor="middle">CHIPSET</text>
      </g>

      <!-- SATA 6Gbps Storage Ports -->
      <g transform="translate(480, 500)">
        <rect x="0" y="0" width="70" height="28" rx="4" fill="#1d4ed8" stroke="#93c5fd"/>
        <rect x="0" y="38" width="70" height="28" rx="4" fill="#1d4ed8" stroke="#93c5fd"/>
        <text x="35" y="18" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">SATA 1</text>
        <text x="35" y="56" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">SATA 2</text>
      </g>
    </g>
  </g>

  <!-- Right: Assembly Teardown Diagnostics & Bench Protocols -->
  <g transform="translate(980, 140)">
    <rect x="0" y="0" width="872" height="760" rx="18" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
    
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" letter-spacing="1">HARDWARE DIAGNOSTIC CHECKLIST &amp; BENCH PROTOCOLS</text>

      <!-- Test 1: Power-On Self-Test (POST) -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="790" height="110" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="45" cy="55" r="22" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
        <text x="45" y="62" fill="#34d399" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">✓</text>
        <text x="85" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">POST Code Status: [0xAA] Boot Successful</text>
        <text x="85" y="65" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">All hardware subsystems initialized without beep code or debug LED faults.</text>
        <text x="85" y="88" fill="#34d399" font-family="monospace" font-size="12">CPU OK • RAM OK • GPU INITIALIZED • VBIOS LOADED</text>
      </g>

      <!-- Test 2: Thermal Paste & Heatsink Mounting -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="790" height="110" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
        <circle cx="45" cy="55" r="22" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
        <text x="45" y="62" fill="#60a5fa" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">✓</text>
        <text x="85" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Thermal Interface Material (TIM) Application</text>
        <text x="85" y="65" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">High thermal conductivity compound (8.5 W/mK) applied via pea method.</text>
        <text x="85" y="88" fill="#38bdf8" font-family="monospace" font-size="12">IDLE TEMP: 32°C • FULL STRESS TEST PEAK: 68°C (ZERO THERMAL THROTTLING)</text>
      </g>

      <!-- Test 3: Laptop Teardown & SO-DIMM Upgrade -->
      <g transform="translate(0, 290)">
        <rect x="0" y="0" width="790" height="110" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
        <circle cx="45" cy="55" r="22" fill="#2e1065" stroke="#8b5cf6" stroke-width="2"/>
        <text x="45" y="62" fill="#a78bfa" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">✓</text>
        <text x="85" y="42" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Laptop Teardown &amp; Internal Maintenance</text>
        <text x="85" y="65" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">Chassis disassembly, copper heatpipe dust purge, CMOS battery check, and ribbon cable routing.</text>
        <text x="85" y="88" fill="#c4b5fd" font-family="monospace" font-size="12">ESD PROTECTED WORKBENCH • ZERO STRIPPED SCREWS</text>
      </g>

      <!-- Power Supply Voltage Rails Stability Table -->
      <g transform="translate(0, 420)">
        <rect x="0" y="0" width="790" height="260" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>
        <text x="25" y="35" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800">ATX POWER SUPPLY MULTIMETER VOLTAGE TOLERANCE TEST</text>
        
        <g transform="translate(25, 60)" font-family="monospace" font-size="14">
          <text y="0" fill="#94a3b8">RAIL        NOMINAL     MEASURED     TOLERANCE     STATUS</text>
          <text y="35" fill="#f8fafc"><tspan fill="#38bdf8">+12V Rail</tspan>   12.00 V     12.08 V      ±1.2%         <tspan fill="#34d399">EXCELLENT ✓</tspan></text>
          <text y="70" fill="#f8fafc"><tspan fill="#38bdf8">+5V Rail</tspan>    5.00 V      5.03 V       ±0.8%         <tspan fill="#34d399">EXCELLENT ✓</tspan></text>
          <text y="105" fill="#f8fafc"><tspan fill="#38bdf8">+3.3V Rail</tspan>  3.30 V      3.32 V       ±0.6%         <tspan fill="#34d399">EXCELLENT ✓</tspan></text>
          <text y="140" fill="#f8fafc"><tspan fill="#38bdf8">+5VSB</tspan>       5.00 V      5.01 V       ±0.2%         <tspan fill="#34d399">EXCELLENT ✓</tspan></text>
          <text y="175" fill="#34d399">VERDICT: Ripple noise under 20mV peak-to-peak. Full stability under 100% synthetic load.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Telemetry HUD Bar -->
  <g transform="translate(48, 925)">
    <rect x="0" y="0" width="1824" height="105" rx="14" fill="#0a0f1d" stroke="#1e293b" stroke-width="1.5"/>
    <g transform="translate(30, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">FORM FACTOR</text>
      <text x="0" y="52" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="800">Micro-ATX (244 × 244 mm)</text>
    </g>
    <g transform="translate(490, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">CPU SOCKET</text>
      <text x="0" y="52" fill="#f8fafc" font-family="monospace" font-size="22" font-weight="800">LGA 1155 / AM4 Multi-Platform</text>
    </g>
    <g transform="translate(980, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">STORAGE INTERFACE</text>
      <text x="0" y="52" fill="#00e5ff" font-family="monospace" font-size="22" font-weight="800">SATA III 6Gb/s &amp; NVMe PCIe Gen3</text>
    </g>
    <g transform="translate(1450, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">DIAGNOSTIC BENCHMARK</text>
      <text x="0" y="52" fill="#34d399" font-family="monospace" font-size="22" font-weight="800">MemTest86 0 Errors • 100% Passed</text>
    </g>
  </g>
</svg>