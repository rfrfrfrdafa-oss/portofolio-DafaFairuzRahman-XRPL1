<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="p11Bg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#0d1828"/>
      <stop offset="65%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#040811"/>
    </radialGradient>
    <linearGradient id="p11DiamondOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d2d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="p11DiamondInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="p11CyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="p11RedGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="p11ChipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <clipPath id="p11DiamondClip">
      <polygon points="960,210 1270,520 960,830 650,520"/>
    </clipPath>
  </defs>

  <style>
    @keyframes p11NeonPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    @keyframes p11FloatA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes p11FloatB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes p11StarTwinkle {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .p11-frame { animation: p11NeonPulse 2.4s infinite ease-in-out; }
    .p11-chip-top { animation: p11FloatA 3.8s infinite ease-in-out; }
    .p11-chip-bot { animation: p11FloatB 4.2s infinite ease-in-out; }
    .p11-dot { animation: p11StarTwinkle 1.6s infinite ease-in-out; }
  </style>

  <rect width="1920" height="1200" fill="url(#p11Bg)"/>

  <rect x="0" y="0" width="1920" height="96" fill="rgba(7, 13, 24, 0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="64" y="60" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#ffffff">CV</text>
  <circle cx="144" cy="48" r="22" fill="none" stroke="#00e5ff" stroke-width="4"/>
  <path d="M 134 36 L 146 36 C 155 36, 159 42, 159 48 C 159 54, 155 60, 146 60 L 134 60 Z" fill="#ffffff"/>
  <ellipse cx="144" cy="48" rx="28" ry="10" transform="rotate(-24 144 48)" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <g transform="translate(1320, 24)">
    <rect x="0" y="0" width="128" height="48" rx="24" fill="rgba(18, 26, 45, 0.85)" stroke="rgba(0, 229, 255, 0.35)" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="9" fill="#00e5ff"/>
    <rect x="148" y="0" width="56" height="48" rx="24" fill="rgba(18, 26, 45, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="220" y="0" width="56" height="48" rx="24" fill="rgba(18, 26, 45, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="292" y="0" width="56" height="48" rx="24" fill="rgba(18, 26, 45, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <line x1="382" y1="14" x2="424" y2="14" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="382" y1="24" x2="424" y2="24" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="382" y1="34" x2="424" y2="34" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g class="p11-frame">
    <polygon points="960,185 1295,520 960,855 625,520" fill="#030712" stroke="url(#p11DiamondOuter)" stroke-width="8" filter="url(#p11RedGlow)"/>
    <polygon points="960,210 1270,520 960,830 650,520" fill="#060c1a" stroke="url(#p11DiamondInner)" stroke-width="4"/>
  </g>

  <g clip-path="url(#p11DiamondClip)">
    <rect x="750" y="510" width="420" height="280" rx="28" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <circle cx="808" cy="610" r="36" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="808" cy="610" r="18" fill="#94a3b8"/>
    <circle cx="1112" cy="610" r="36" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="1112" cy="610" r="18" fill="#94a3b8"/>
    <g stroke="#475569" stroke-width="6">
      <line x1="875" y1="560" x2="875" y2="665"/>
      <line x1="905" y1="560" x2="905" y2="665"/>
      <line x1="935" y1="560" x2="935" y2="665"/>
      <line x1="965" y1="560" x2="965" y2="665"/>
      <line x1="995" y1="560" x2="995" y2="665"/>
      <line x1="1025" y1="560" x2="1025" y2="665"/>
    </g>
    <circle cx="955" cy="362" r="42" fill="#e2b798"/>
    <path d="M 914 342 C 920 315, 992 315, 998 342 Z" fill="#1e293b"/>
    <path d="M 885 408 L 1025 408 L 1042 545 L 868 545 Z" fill="#0f172a"/>
    <polygon points="942,408 968,408 955,446" fill="#f8fafc"/>
  </g>

  <g class="p11-chip-top" filter="url(#p11ChipShadow)">
    <rect x="570" y="295" width="335" height="96" rx="20" fill="rgba(18, 26, 45, 0.94)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5"/>
    <rect x="594" y="318" width="50" height="50" rx="14" fill="rgba(0, 229, 255, 0.14)"/>
    <text x="619" y="352" text-anchor="middle" font-family="'Consolas', monospace" font-weight="bold" font-size="22" fill="#00e5ff">&lt;/&gt;</text>
    <text x="664" y="340" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#ffffff">Web &amp; Backend</text>
    <text x="664" y="368" font-family="'Segoe UI', sans-serif" font-size="18" fill="#94a3b8">Clean Code</text>
  </g>

  <g class="p11-chip-bot" filter="url(#p11ChipShadow)">
    <rect x="990" y="720" width="335" height="96" rx="20" fill="rgba(18, 26, 45, 0.94)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5"/>
    <rect x="1014" y="743" width="50" height="50" rx="14" fill="rgba(0, 229, 255, 0.14)"/>
    <rect x="1028" y="757" width="22" height="22" rx="4" fill="none" stroke="#00e5ff" stroke-width="3"/>
    <text x="1084" y="765" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#ffffff">Robotics &amp; IoT</text>
    <text x="1084" y="793" font-family="'Segoe UI', sans-serif" font-size="18" fill="#94a3b8">Hardware Logic</text>
  </g>

  <g transform="translate(550, 995)" filter="url(#p11ChipShadow)">
    <rect width="820" height="72" rx="36" fill="rgba(10, 22, 42, 0.92)" stroke="rgba(0, 229, 255, 0.35)" stroke-width="1.5"/>
    <circle cx="44" cy="36" r="6.5" fill="#00e5ff" class="p11-dot"/>
    <text x="72" y="44" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="22" fill="#00e5ff">Software Engineering • SMK Krian 1</text>
    <rect x="652" y="13" width="142" height="46" rx="23" fill="rgba(0, 229, 255, 0.14)" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.2"/>
    <text x="723" y="43" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Wish</text>
  </g>
</svg>
