<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="100%" height="100%">
  <defs>
    <!-- Deep Radial Cosmic Studio Background matching images14.png -->
    <radialGradient id="studioBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#0a1622"/>
      <stop offset="55%" stop-color="#050d14"/>
      <stop offset="100%" stop-color="#02050a"/>
    </radialGradient>

    <!-- Neon Stem Gradients -->
    <linearGradient id="stemCyanGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="stemBlueGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="stemMagentaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="stemRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="stemYellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="stemGreenGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <clipPath id="albumClip">
      <rect x="810" y="420" width="300" height="300" rx="18"/>
    </clipPath>
  </defs>

  <style>
    @keyframes bassPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      45% { transform: scale(1.035); opacity: 1; }
    }
    @keyframes midPulse {
      0%, 100% { transform: scale(1); opacity: 0.88; }
      55% { transform: scale(1.045); opacity: 1; }
    }
    @keyframes particleFloat {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.55; }
      50% { transform: translateY(-9px) scale(1.18); opacity: 0.95; }
    }
    @keyframes cardBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
    .wave-top { transform-box: fill-box; transform-origin: 50% 100%; animation: midPulse 1.6s infinite ease-in-out; }
    .wave-tr { transform-box: fill-box; transform-origin: 0% 100%; animation: bassPulse 1.9s infinite ease-in-out 0.2s; }
    .wave-br { transform-box: fill-box; transform-origin: 0% 0%; animation: bassPulse 1.5s infinite ease-in-out 0.1s; }
    .wave-bot { transform-box: fill-box; transform-origin: 50% 0%; animation: midPulse 1.4s infinite ease-in-out 0.35s; }
    .wave-bl { transform-box: fill-box; transform-origin: 100% 0%; animation: bassPulse 1.8s infinite ease-in-out 0.15s; }
    .wave-tl { transform-box: fill-box; transform-origin: 100% 100%; animation: midPulse 2.0s infinite ease-in-out 0.45s; }
    .particle { animation: particleFloat 2.8s infinite ease-in-out; }
    .p-delay-1 { animation-delay: 0.4s; }
    .p-delay-2 { animation-delay: 0.9s; }
    .p-delay-3 { animation-delay: 1.5s; }
    .album-group { transform-box: fill-box; transform-origin: center; animation: cardBeat 1.5s infinite ease-in-out; }
  </style>

  <!-- Studio Canvas -->
  <rect width="1920" height="1200" fill="url(#studioBg)"/>

  <!-- ==================== 6 RADIAL NEON AUDIO SPECTRUM STEMS ==================== -->
  <!-- 1. Top Stem (Blue) -->
  <g class="wave-top" filter="url(#neonBloom)">
    <path d="M 960 330 L 954 330 L 953 200 C 950 155, 932 105, 938 68 C 942 40, 954 12, 960 2 C 966 12, 978 40, 982 68 C 988 105, 970 155, 967 200 L 966 330 Z" fill="url(#stemBlueGrad)" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- 2. Top-Right Stem (Neon Magenta / Purple) -->
  <g class="wave-tr" filter="url(#neonBloom)">
    <path d="M 1185 438 C 1270 390, 1345 335, 1410 278 C 1455 240, 1515 210, 1575 190 C 1650 165, 1785 85, 1918 4 C 1815 95, 1710 185, 1625 262 C 1555 322, 1470 375, 1375 398 C 1300 416, 1235 432, 1185 438 Z" fill="url(#stemMagentaGrad)" stroke="#d946ef" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- 3. Bottom-Right Stem (Coral Red) -->
  <g class="wave-br" filter="url(#neonBloom)">
    <path d="M 1186 696 C 1265 730, 1335 765, 1390 835 C 1428 885, 1475 918, 1532 910 C 1575 904, 1625 898, 1685 904 C 1775 914, 1855 965, 1918 1196 C 1825 1130, 1710 1120, 1645 1068 C 1605 1035, 1570 985, 1525 942 C 1465 905, 1385 900, 1320 842 C 1265 792, 1222 742, 1186 696 Z" fill="url(#stemRedGrad)" stroke="#ef4444" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- 4. Bottom Stem (Yellow Gold) -->
  <g class="wave-bot" filter="url(#neonBloom)">
    <path d="M 915 820 C 905 835, 922 868, 940 895 C 948 912, 912 925, 902 945 C 895 960, 932 978, 938 1002 C 942 1022, 924 1038, 926 1058 C 928 1082, 945 1102, 930 1132 C 920 1150, 910 1168, 960 1198 C 1010 1168, 1000 1150, 990 1132 C 975 1102, 992 1082, 994 1058 C 996 1038, 978 1022, 982 1002 C 988 978, 1025 960, 1018 945 C 1008 925, 972 912, 980 895 C 998 868, 1015 835, 1005 820 C 985 832, 935 832, 915 820 Z" fill="url(#stemYellowGrad)" stroke="#facc15" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- 5. Bottom-Left Stem (Neon Green) -->
  <g class="wave-bl" filter="url(#neonBloom)">
    <path d="M 735 696 C 695 752, 650 815, 588 848 C 520 885, 455 900, 385 935 C 260 1005, 130 1100, 4 1196 C 140 1105, 285 1015, 425 930 C 485 890, 535 835, 595 775 C 645 728, 695 710, 735 696 Z" fill="url(#stemGreenGrad)" stroke="#22c55e" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- 6. Top-Left Stem (Cyan) -->
  <g class="wave-tl" filter="url(#neonBloom)">
    <path d="M 734 438 C 615 362, 495 292, 365 215 C 285 170, 215 115, 145 75 C 95 46, 48 22, 4 4 C 85 52, 165 112, 265 162 C 395 232, 565 335, 734 438 Z" fill="url(#stemCyanGrad)" stroke="#06b6d4" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Floating Reactive Beat Particles -->
  <g>
    <circle cx="755" cy="480" r="6" fill="#f97316" class="particle"/>
    <circle cx="765" cy="560" r="9" fill="#22c55e" class="particle p-delay-1"/>
    <circle cx="748" cy="562" r="7" fill="#ef4444" class="particle p-delay-2"/>
    <circle cx="756" cy="598" r="6" fill="#64748b" class="particle p-delay-3"/>
    <circle cx="685" cy="635" r="5" fill="#94a3b8" class="particle p-delay-1"/>
    <circle cx="780" cy="692" r="5" fill="#cbd5e1" class="particle p-delay-2"/>
    <circle cx="1182" cy="485" r="6" fill="#475569" class="particle p-delay-3"/>
    <circle cx="1142" cy="635" r="8" fill="#facc15" class="particle p-delay-1"/>
    <circle cx="1152" cy="705" r="6" fill="#22c55e" class="particle"/>
    <circle cx="1032" cy="772" r="7" fill="#ffffff" class="particle p-delay-2"/>
    <circle cx="1078" cy="792" r="9" fill="#f8fafc" class="particle p-delay-1"/>
    <circle cx="1138" cy="775" r="6" fill="#64748b" class="particle p-delay-3"/>
    <circle cx="1225" cy="645" r="7" fill="#64748b" class="particle p-delay-2"/>
    <circle cx="842" cy="778" r="6" fill="#64748b" class="particle"/>
  </g>

  <!-- ==================== CENTER ALBUM ART CARD ("Sailor Song" - Gigi Perez) ==================== -->
  <g class="album-group">
    <rect x="810" y="420" width="300" height="300" rx="18" fill="#ffffff" filter="url(#cardShadow)"/>
    <g clip-path="url(#albumClip)">
      <!-- Minimalist Album Text -->
      <text x="1030" y="468" font-family="'Courier New', monospace" font-weight="bold" font-size="11" fill="#334155">AT THE BEACH</text>
      <text x="1030" y="482" font-family="'Courier New', monospace" font-size="10" fill="#475569">IN EVERY LIFE</text>
      <!-- Minimalist Hand-Drawn Lighthouse & Shore Illustration -->
      <path d="M 810 662 Q 875 645, 920 658 T 1015 654 T 1110 664" fill="none" stroke="#1e293b" stroke-width="2.5"/>
      <path d="M 810 682 Q 920 676, 1020 684 T 1110 678" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Lighthouse -->
      <polygon points="866,535 882,535 888,655 860,655" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <rect x="862" y="516" width="24" height="19" fill="#0f172a"/>
      <polygon points="858,516 874,498 890,516" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
      <line x1="864" y1="570" x2="884" y2="570" stroke="#0f172a" stroke-width="3"/>
      <line x1="862" y1="605" x2="886" y2="605" stroke="#0f172a" stroke-width="3"/>
      <!-- Small Silhouette Person -->
      <circle cx="938" cy="632" r="4" fill="#0f172a"/>
      <path d="M 935 636 L 941 636 L 944 654 L 932 654 Z" fill="#0f172a"/>
      <!-- Tiny Distant Sailboat -->
      <polygon points="1035,638 1068,638 1060,649 1041,649" fill="#0f172a"/>
      <polygon points="1051,615 1051,636 1063,636" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    </g>
    <!-- Song Title & Artist -->
    <text x="960" y="758" text-anchor="middle" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="28" fill="#ffffff">Sailor Song</text>
    <text x="960" y="786" text-anchor="middle" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="500" font-size="19" fill="#00e5ff">Gigi Perez</text>
  </g>

  <!-- Tech Stack HUD Watermark -->
  <g transform="translate(36, 32)">
    <rect width="465" height="44" rx="22" fill="rgba(11,15,25,0.78)" stroke="rgba(0,229,255,0.35)" stroke-width="1.2"/>
    <circle cx="24" cy="22" r="5.5" fill="#00e5ff"/>
    <text x="42" y="27" font-family="'Consolas', monospace" font-size="15" font-weight="bold" fill="#e2e8f0">GLSL .FRAG • OPENTYPE • NODE.JS • JSON</text>
  </g>
</svg>
