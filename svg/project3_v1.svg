<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041209"/>
      <stop offset="50%" stop-color="#091f13"/>
      <stop offset="100%" stop-color="#030c06"/>
    </linearGradient>
    <filter id="p3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#p3Bg)"/>

  <!-- Top Title HUD Bar -->
  <rect x="48" y="44" width="1824" height="64" rx="12" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="80" cy="76" r="8" fill="#10b981" filter="url(#p3Glow)"/>
  <text x="105" y="82" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">SMART ECO-TECH &amp; IOT AUTOMATED HYDROPONICS</text>
  <text x="680" y="82" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600">PROJECT 03: UPCYCLED CULTIVATION &amp; SENSOR MONITORING SYSTEM</text>
  <rect x="1560" y="56" width="140" height="40" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <text x="1630" y="81" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ULTRA HD 1080P</text>
  <rect x="1715" y="56" width="135" height="40" rx="8" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1"/>
  <text x="1782" y="81" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ESP32 SENSORS</text>

  <!-- Left: Hydroponic Reservoir & Plant Biology CAD Blueprint -->
  <g transform="translate(68, 140)">
    <rect x="0" y="0" width="872" height="760" rx="18" fill="#051a0e" stroke="#047857" stroke-width="2"/>
    <text x="40" y="48" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" letter-spacing="1">TECHNICAL HYDROPONICS PROTOTYPE SCHEMATIC</text>
    
    <!-- Upcycled PET Bottle Reservoir Graphic -->
    <g transform="translate(436, 420)">
      <!-- Reservoir Glass/Plastic Bottle Silhouette -->
      <path d="M -160 220 L -180 20 L -140 -120 L -90 -160 H 90 L 140 -120 L 180 20 L 160 220 Z" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="3"/>
      <!-- Water Level Gradient -->
      <path d="M -170 210 L -178 70 Q 0 50 178 70 L 170 210 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Water Waves & Bubble Particles -->
      <circle cx="-60" cy="140" r="8" fill="#38bdf8" fill-opacity="0.4"/>
      <circle cx="40" cy="160" r="12" fill="#38bdf8" fill-opacity="0.4"/>
      <circle cx="80" cy="110" r="6" fill="#38bdf8" fill-opacity="0.5"/>
      <text x="0" y="170" fill="#bae6fd" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">NUTRIENT WATER SOLUTION (85% RECIRCULATED)</text>

      <!-- Submerged Plant Root System -->
      <g stroke="#fef08a" stroke-width="2.5" fill="none" opacity="0.85">
        <path d="M 0 -120 Q -40 -20 -60 120"/>
        <path d="M 0 -120 Q 20 -40 50 130"/>
        <path d="M -20 -100 Q -80 0 -90 100"/>
        <path d="M 20 -100 Q 80 10 100 110"/>
        <path d="M -40 -50 Q -70 30 -50 80"/>
        <path d="M 30 -60 Q 60 20 70 90"/>
      </g>

      <!-- Lush Green Water Spinach Foliage (Kangkung Leaves) -->
      <g fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#p3Glow)">
        <!-- Stems -->
        <path d="M 0 -120 Q -60 -240 -100 -310" stroke="#4ade80" stroke-width="6" fill="none"/>
        <path d="M 0 -120 Q 20 -220 50 -330" stroke="#4ade80" stroke-width="6" fill="none"/>
        <path d="M 0 -120 Q 90 -200 130 -290" stroke="#4ade80" stroke-width="5" fill="none"/>
        <path d="M 0 -120 Q -30 -180 -150 -240" stroke="#4ade80" stroke-width="5" fill="none"/>

        <!-- Leaves -->
        <ellipse cx="-100" cy="-310" rx="35" ry="70" transform="rotate(-25 -100 -310)"/>
        <ellipse cx="50" cy="-330" rx="38" ry="75" transform="rotate(15 50 -330)"/>
        <ellipse cx="130" cy="-290" rx="34" ry="65" transform="rotate(40 130 -290)"/>
        <ellipse cx="-150" cy="-240" rx="32" ry="60" transform="rotate(-55 -150 -240)"/>
        <ellipse cx="-40" cy="-260" rx="28" ry="55" transform="rotate(-10 -40 -260)"/>
        <ellipse cx="80" cy="-250" rx="30" ry="58" transform="rotate(25 80 -250)"/>
      </g>

      <!-- Sensor Probes in Reservoir -->
      <!-- pH Sensor Probe -->
      <rect x="-130" y="30" width="22" height="130" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="-119" cy="155" r="7" fill="#fbbf24"/>
      <text x="-140" y="90" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">pH PROBE</text>

      <!-- Submersible DC Pump -->
      <rect x="70" y="130" width="60" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="145" y="160" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">DC PUMP (12V)</text>
    </g>
  </g>

  <!-- Right: Real-Time IoT Telemetry & Eco-Analytics -->
  <g transform="translate(980, 140)">
    <rect x="0" y="0" width="872" height="760" rx="18" fill="#091f13" stroke="#047857" stroke-width="2"/>
    
    <!-- Sensor Readings Grid -->
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" letter-spacing="1">LIVE SENSOR TELEMETRY READOUTS</text>

      <!-- Card 1: pH Level -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="375" height="135" rx="14" fill="#042f1a" stroke="#10b981" stroke-width="1.5"/>
        <text x="25" y="35" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">WATER ACIDITY (pH)</text>
        <text x="25" y="80" fill="#f8fafc" font-family="monospace" font-size="38" font-weight="800">6.45 <tspan font-size="18" fill="#34d399">pH</tspan></text>
        <text x="25" y="112" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">✓ OPTIMAL ABSORPTION RANGE (6.0 - 6.8)</text>
      </g>

      <!-- Card 2: Electrical Conductivity (EC) -->
      <g transform="translate(415, 30)">
        <rect x="0" y="0" width="375" height="135" rx="14" fill="#042f1a" stroke="#00e5ff" stroke-width="1.5"/>
        <text x="25" y="35" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">NUTRIENT CONCENTRATION (EC)</text>
        <text x="25" y="80" fill="#00e5ff" font-family="monospace" font-size="38" font-weight="800">1.82 <tspan font-size="18" fill="#38bdf8">mS/cm</tspan></text>
        <text x="25" y="112" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">✓ BALANCED VEGETATIVE FORMULA</text>
      </g>

      <!-- Card 3: Water Temperature -->
      <g transform="translate(0, 190)">
        <rect x="0" y="0" width="375" height="135" rx="14" fill="#042f1a" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="25" y="35" fill="#fde68a" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">RESERVOIR WATER TEMP</text>
        <text x="25" y="80" fill="#fbbf24" font-family="monospace" font-size="38" font-weight="800">24.6 <tspan font-size="18" fill="#fde68a">°C</tspan></text>
        <text x="25" y="112" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">✓ ROOT HEALTH STABLE (MAX 28°C)</text>
      </g>

      <!-- Card 4: Water Level -->
      <g transform="translate(415, 190)">
        <rect x="0" y="0" width="375" height="135" rx="14" fill="#042f1a" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="25" y="35" fill="#ddd6fe" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">ULTRASONIC TANK LEVEL</text>
        <text x="25" y="80" fill="#a78bfa" font-family="monospace" font-size="38" font-weight="800">84.0 <tspan font-size="18" fill="#ddd6fe">%</tspan></text>
        <text x="25" y="112" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">✓ AUTO-REFILL STANDBY</text>
      </g>
    </g>

    <!-- Environmental Impact & Sustainability Breakdown -->
    <g transform="translate(40, 420)">
      <rect x="0" y="0" width="790" height="280" rx="16" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
      <text x="30" y="40" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800">SUSTAINABLE HARDWARE &amp; ECO-TECH HIGHLIGHTS</text>
      
      <g transform="translate(30, 75)">
        <circle cx="15" cy="15" r="14" fill="#10b981" fill-opacity="0.2"/>
        <text x="15" y="21" fill="#34d399" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">1</text>
        <text x="45" y="15" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Upcycled Plastic Bottle Reservoirs</text>
        <text x="45" y="35" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13">Repurposed 1.5L and 5L mineral containers, reducing local plastic landfill waste.</text>
      </g>

      <g transform="translate(30, 135)">
        <circle cx="15" cy="15" r="14" fill="#00e5ff" fill-opacity="0.2"/>
        <text x="15" y="21" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">2</text>
        <text x="45" y="15" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">85% Water Conservation vs Soil</text>
        <text x="45" y="35" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13">Closed-loop nutrient circulation prevents ground runoff and optimizes plant transpiration.</text>
      </g>

      <g transform="translate(30, 195)">
        <circle cx="15" cy="15" r="14" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="15" y="21" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">3</text>
        <text x="45" y="15" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">ESP32 Autonomous Microcontroller</text>
        <text x="45" y="35" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13">Low-power scheduled watering algorithm with real-time WiFi telemetry to mobile web dashboard.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Telemetry HUD Bar -->
  <g transform="translate(48, 925)">
    <rect x="0" y="0" width="1824" height="105" rx="14" fill="#062e1e" stroke="#059669" stroke-width="1.5"/>
    <g transform="translate(30, 25)">
      <text x="0" y="20" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">CROP SPECIES</text>
      <text x="0" y="52" fill="#34d399" font-family="monospace" font-size="22" font-weight="800">Ipomoea aquatica (Water Spinach)</text>
    </g>
    <g transform="translate(490, 25)">
      <text x="0" y="20" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">HARVEST CYCLE</text>
      <text x="0" y="52" fill="#00e5ff" font-family="monospace" font-size="22" font-weight="800">21 - 25 Days to Full Maturity</text>
    </g>
    <g transform="translate(980, 25)">
      <text x="0" y="20" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">PUMP AUTOMATION</text>
      <text x="0" y="52" fill="#fde68a" font-family="monospace" font-size="22" font-weight="800">15 min Active / 45 min Rest (Timer)</text>
    </g>
    <g transform="translate(1450, 25)">
      <text x="0" y="20" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">SYSTEM EFFICIENCY</text>
      <text x="0" y="52" fill="#ffffff" font-family="monospace" font-size="22" font-weight="800">99.8% Survival Rate Recorded</text>
    </g>
  </g>
</svg>