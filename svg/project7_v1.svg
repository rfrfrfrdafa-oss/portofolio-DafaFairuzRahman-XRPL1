<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="p7Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <pattern id="pixelGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
    <filter id="p7Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#p7Bg)"/>

  <!-- Top Title HUD Bar -->
  <rect x="48" y="44" width="1824" height="64" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="80" cy="76" r="8" fill="#f59e0b" filter="url(#p7Glow)"/>
  <text x="105" y="82" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">2D GAME ENGINE &amp; INTERACTIVE ROOM EDITOR</text>
  <text x="630" y="82" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600">PROJECT 07: GAME MAKER STUDIO ARCHITECTURE &amp; GML LOGIC</text>
  <rect x="1560" y="56" width="140" height="40" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1"/>
  <text x="1630" y="81" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ULTRA HD 1080P</text>
  <rect x="1715" y="56" width="135" height="40" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="1782" y="81" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">GML SCRIPT 60FPS</text>

  <!-- Left: Room Level Editor Viewport with Pixel Tilemap -->
  <g transform="translate(68, 140)">
    <rect x="0" y="0" width="1020" height="760" rx="18" fill="#020617" stroke="#334155" stroke-width="2"/>
    <text x="35" y="45" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" letter-spacing="1">ROOM LEVEL EDITOR (room_level_01)</text>

    <!-- Inner Level Canvas with 32x32 Pixel Grid -->
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="970" height="665" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="0" y="0" width="970" height="665" rx="10" fill="url(#pixelGrid)" opacity="0.65"/>

      <!-- Platform Blocks (Stone Tilemap) -->
      <!-- Ground Level -->
      <g fill="#1e293b" stroke="#38bdf8" stroke-width="1.5">
        <rect x="64" y="544" width="832" height="64" rx="4"/>
        <rect x="128" y="416" width="224" height="32" rx="4"/>
        <rect x="448" y="320" width="256" height="32" rx="4"/>
        <rect x="736" y="224" width="192" height="32" rx="4"/>
      </g>

      <!-- Collectible Glowing Power-up Coins -->
      <g filter="url(#p7Glow)">
        <circle cx="240" cy="368" r="14" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
        <circle cx="576" cy="272" r="14" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
        <circle cx="832" cy="176" r="14" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
      </g>

      <!-- Player Hero Character (2D Pixel Sprite with AABB Hitbox) -->
      <g transform="translate(192, 448)">
        <!-- AABB Collision Box (Green Wireframe) -->
        <rect x="-24" y="-72" width="48" height="72" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
        <text x="0" y="-82" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">AABB (x, y)</text>
        
        <!-- Hero Character Sprite -->
        <rect x="-18" y="-64" width="36" height="64" rx="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
        <!-- Face Visor -->
        <rect x="-12" y="-55" width="24" height="14" rx="4" fill="#00e5ff" filter="url(#p7Glow)"/>
        <!-- Velocity Vector Arrow (hspd = +4, vspd = -8 Jump) -->
        <line x1="0" y1="-32" x2="45" y2="-65" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
        <polygon points="45,-65 35,-68 40,-55" fill="#f43f5e"/>
        <text x="50" y="-70" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="700">vec(4, -8)</text>
      </g>

      <!-- Goal / Exit Portal -->
      <g transform="translate(832, 160)" filter="url(#p7Glow)">
        <ellipse cx="0" cy="0" rx="25" ry="50" fill="#8b5cf6" stroke="#c084fc" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="14" ry="32" fill="#00e5ff"/>
      </g>

      <!-- In-Game Debug HUD -->
      <g transform="translate(30, 30)">
        <rect x="0" y="0" width="280" height="40" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
        <text x="20" y="26" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">HP: <tspan fill="#ef4444">100</tspan> | SCORE: <tspan fill="#fbbf24">2,450</tspan></text>
      </g>
    </g>
  </g>

  <!-- Right: GML Script Logic, Sprite Sheets & Event Tree -->
  <g transform="translate(1120, 140)">
    <rect x="0" y="0" width="732" height="760" rx="18" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Sprite Sheet Animation Strip -->
    <g transform="translate(35, 35)">
      <text x="0" y="0" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">PLAYER SPRITE SHEET (spr_player_run)</text>
      <rect x="0" y="15" width="660" height="95" rx="10" fill="#030712" stroke="#334155" stroke-width="1.5"/>
      
      <!-- 4 Animation Frames in Strip -->
      <g transform="translate(30, 28)">
        <rect x="0" y="0" width="50" height="70" rx="4" fill="#1e293b" stroke="#38bdf8"/>
        <text x="25" y="85" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Frame 0</text>
      </g>
      <g transform="translate(180, 28)">
        <rect x="0" y="0" width="50" height="70" rx="4" fill="#1e293b" stroke="#38bdf8"/>
        <text x="25" y="85" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Frame 1</text>
      </g>
      <g transform="translate(330, 28)">
        <rect x="0" y="0" width="50" height="70" rx="4" fill="#1e293b" stroke="#38bdf8"/>
        <text x="25" y="85" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Frame 2</text>
      </g>
      <g transform="translate(480, 28)">
        <rect x="0" y="0" width="50" height="70" rx="4" fill="#1e293b" stroke="#38bdf8"/>
        <text x="25" y="85" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Frame 3</text>
      </g>
    </g>

    <!-- GML Event Tree & Physics Collision Script -->
    <g transform="translate(35, 175)">
      <text x="0" y="0" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">GML PHYSICS &amp; COLLISION SCRIPT (scr_movement)</text>
      <rect x="0" y="15" width="660" height="520" rx="12" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
      
      <g transform="translate(25, 50)" font-family="monospace" font-size="14" font-weight="600" xml:space="preserve">
        <text y="0"><tspan fill="#64748b">// 1. Handle Horizontal Input &amp; Physics</tspan></text>
        <text y="24"><tspan fill="#f8fafc">var _move = keyboard_check(vk_right) - keyboard_check(vk_left);</tspan></text>
        <text y="48"><tspan fill="#f8fafc">hspd = _move * walk_speed;</tspan></text>
        
        <text y="90"><tspan fill="#64748b">// 2. Gravity &amp; Jump Logic</tspan></text>
        <text y="114"><tspan fill="#f8fafc">vspd += grav;</tspan></text>
        <text y="138"><tspan fill="#f43f5e">if</tspan> <tspan fill="#f8fafc">(place_meeting(x, y + 1, obj_wall)) {</tspan></text>
        <text y="162"><tspan fill="#f8fafc">    on_ground = </tspan><tspan fill="#10b981">true</tspan><tspan fill="#f8fafc">;</tspan></text>
        <text y="186"><tspan fill="#f43f5e">    if</tspan> <tspan fill="#f8fafc">(keyboard_check_pressed(vk_space)) vspd = -jump_force;</tspan></text>
        <text y="210"><tspan fill="#f8fafc">}</tspan></text>
        
        <text y="255"><tspan fill="#64748b">// 3. Pixel-Perfect Horizontal Collision</tspan></text>
        <text y="279"><tspan fill="#f43f5e">if</tspan> <tspan fill="#f8fafc">(place_meeting(x + hspd, y, obj_wall)) {</tspan></text>
        <text y="303"><tspan fill="#f43f5e">    while</tspan> <tspan fill="#f8fafc">(!place_meeting(x + sign(hspd), y, obj_wall)) {</tspan></text>
        <text y="327"><tspan fill="#f8fafc">        x += sign(hspd);</tspan></text>
        <text y="351"><tspan fill="#f8fafc">    }</tspan></text>
        <text y="375"><tspan fill="#f8fafc">    hspd = 0;</tspan></text>
        <text y="399"><tspan fill="#f8fafc">}</tspan></text>
        <text y="423"><tspan fill="#f8fafc">x += hspd;</tspan></text>
        <text y="447"><tspan fill="#f8fafc">y += vspd;</tspan></text>
      </g>
    </g>
  </g>

  <!-- Bottom Telemetry HUD Bar -->
  <g transform="translate(48, 925)">
    <rect x="0" y="0" width="1824" height="105" rx="14" fill="#0a0f1d" stroke="#1e293b" stroke-width="1.5"/>
    <g transform="translate(30, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">GAME ENGINE</text>
      <text x="0" y="52" fill="#fbbf24" font-family="monospace" font-size="22" font-weight="800">Game Maker Studio 2 (2D Native)</text>
    </g>
    <g transform="translate(490, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">COLLISION PRECISION</text>
      <text x="0" y="52" fill="#00e5ff" font-family="monospace" font-size="22" font-weight="800">Tilemap Mask AABB Pixel-Exact</text>
    </g>
    <g transform="translate(980, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">TARGET FRAME RATE</text>
      <text x="0" y="52" fill="#34d399" font-family="monospace" font-size="22" font-weight="800">Rock-Solid 60.0 FPS (16.6 ms)</text>
    </g>
    <g transform="translate(1450, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">AUDIO &amp; SOUND FX</text>
      <text x="0" y="52" fill="#f8fafc" font-family="monospace" font-size="22" font-weight="800">Polyphonic 8-bit Synth Audio</text>
    </g>
  </g>
</svg>